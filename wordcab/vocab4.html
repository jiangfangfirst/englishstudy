<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>单词夺宝 · 闯关记单词</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F3B5E'/%3E%3Cpath d='M6 22 L16 6 L26 22 Z' fill='none' stroke='%23F6C65C' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12 14h8M11 18h10' stroke='%23F6C65C' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#1F3B5E; --navy-2:#16293F; --cream:#F6F1E7; --ink:#2B2B2B; --muted:#8a8375;
  --card:#FFFFFF; --gold:#C08A3E; --gold-hi:#F6C65C;
  --blue:#2E82A8; --blue-d:#1f5f7d; --blue-bg:#dceef6;
  --orange:#E8891C; --orange-d:#b86612; --orange-bg:#fbe8d2;
  --red:#D64545; --red-d:#a93434; --red-bg:#f8dcdc;
  --line:#e6dfd2;
}
html{scroll-behavior:auto}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;overflow-x:hidden}
/* ===== 头部 ===== */
.header{background:linear-gradient(180deg,#23426a,#1F3B5E);padding:14px 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;flex-wrap:wrap;box-shadow:0 4px 18px rgba(15,30,48,.25)}
.header h1{font-size:20px;font-weight:800;color:#fff;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.header h1 .t-crown{color:var(--gold-hi);font-size:20px}
#headerInfo{margin-left:auto;font-size:12px;color:rgba(255,255,255,.82);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#headerInfo b{font-weight:600;color:#fff}
.achv{display:inline-flex;gap:3px;font-size:13px;vertical-align:middle}
.achv .ic{line-height:1;opacity:.95}
/* ===== 世界选项卡（三大关） ===== */
.world-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 14px;background:var(--navy-2);}
.world-tab{position:relative;text-align:center;padding:10px 4px 8px;border-radius:12px;cursor:pointer;color:#c9d3e0;transition:all .18s;user-select:none;border:1px solid transparent}
.world-tab .wlabel{font-size:15px;font-weight:700;letter-spacing:1px}
.world-tab .wsub{font-size:10px;color:#93a3b8;margin-top:2px}
.world-tab .wbar{height:4px;border-radius:2px;margin:6px auto 0;width:60%;background:#354a66;transition:all .2s}
.world-tab.active{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff}
.world-tab.active .wsub{color:rgba(255,255,255,.7)}
.world-tab.active .wbar{width:86%}
.world-tab[data-w="basic"] .wbar{background:var(--blue)}
.world-tab[data-w="core"] .wbar{background:var(--orange)}
.world-tab[data-w="extra"] .wbar{background:var(--red)}
.world-tab .wlock{position:absolute;top:-5px;right:4px;font-size:12px;color:var(--gold-hi)}
/* ===== 容器 ===== */
.container{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.view{display:block;animation:viewIn .32s ease both}
.view.hide{display:none}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:18px;padding:18px 16px;box-shadow:0 12px 40px rgba(40,30,10,.08);border:1px solid var(--line)}
/* ===== 总览视图 ===== */
.ov-hero{position:relative;border-radius:18px;overflow:hidden;padding:22px 20px;color:#fff;background:linear-gradient(135deg,#23426a 0%,#1F3B5E 60%,#2b4d7a 100%);box-shadow:0 14px 34px rgba(31,59,94,.35);margin-bottom:14px}
.ov-hero .ov-ghost{position:absolute;right:14px;top:10px;font-size:64px;opacity:.16;user-select:none}
.ov-hero .ov-kicker{font-size:12px;color:rgba(255,255,255,.75);letter-spacing:2px;margin-bottom:6px}
.ov-hero .ov-title{font-size:24px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.ov-hero .ov-desc{font-size:13px;color:rgba(255,255,255,.82);margin-top:8px;line-height:1.6;max-width:340px}
.ov-hero .ov-color{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:middle}
.ov-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ov-stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.ov-stat .v{font-size:24px;font-weight:800;color:var(--navy)}
.ov-stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.ov-cta{width:100%;padding:16px;border:none;border-radius:16px;font-size:17px;font-weight:800;color:#fff;cursor:pointer;letter-spacing:2px;box-shadow:0 10px 24px rgba(0,0,0,.18);transition:transform .12s,filter .15s}
.ov-cta:active{transform:scale(.98);filter:brightness(.94)}
.ov-cta.cta-blue{background:linear-gradient(135deg,#2E82A8,#1f5f7d)}
.ov-cta.cta-orange{background:linear-gradient(135deg,#E8891C,#b86612)}
.ov-cta.cta-red{background:linear-gradient(135deg,#D64545,#a93434)}
/* 关卡地图 */
.lv-block{margin-top:16px}
.lv-block h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px;letter-spacing:1px}
.lv-map{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.lv-node{position:relative;aspect-ratio:1/1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:1px solid var(--line);background:#faf8f3;transition:transform .12s}
.lv-node:active{transform:scale(.95)}
.lv-node .n{font-size:15px;font-weight:800}
.lv-node .st{font-size:9px;color:var(--muted)}
.lv-node.cleared{background:#eef7ee;border-color:#bcdcc2}
.lv-node.cleared .n{color:#3d9a55}
.lv-node.cleared::after{content:"✓";position:absolute;top:-6px;right:-4px;background:var(--gold-hi);color:#4a3300;font-size:11px;font-weight:800;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.lv-node.current{border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(246,198,92,.35);animation:pulse 1.8s ease-in-out infinite}
.lv-node.locked{background:#f0ede6;border-color:#e0dacf;color:#b9b2a5;cursor:not-allowed}
.lv-node.locked .st{color:#c6bfb2}
.lv-node.locked::before{content:"🔒";font-size:15px}
.lv-node.locked .n{display:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
/* 敌人图例 */
.legend{margin-top:16px}
.legend h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px;letter-spacing:1px}
.legend-grid{display:grid;grid-template-columns:1fr;gap:8px}
.legend-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#faf8f3}
.legend-item .eimg{flex:none}
.legend-item .lt{font-size:13px;font-weight:700}
.legend-item .ld{font-size:12px;color:var(--muted);line-height:1.5}
.rules{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.9;padding:12px 14px;background:#faf8f3;border-radius:12px;border:1px dashed var(--line)}
.rules b{color:var(--navy)}
/* ===== 战斗视图 ===== */
.battle-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.battle-top .bt-title{font-size:15px;font-weight:800;color:var(--navy)}
.battle-top .spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--navy)}
.iconbtn:active{transform:scale(.94)}
.hud{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;flex-wrap:wrap}
.hud .hearts{display:flex;gap:3px}
.hud .hearts .ht{width:22px;height:22px}
.hud .ht.off{opacity:.18}
.hud .cnt{margin-left:auto;font-size:13px;color:var(--muted)}
.hud .cnt b{color:var(--navy);font-size:15px}
.progbar{flex-basis:100%;height:8px;background:#ece5d8;border-radius:5px;overflow:hidden}
.progfill{height:100%;border-radius:5px;transition:width .3s;background:linear-gradient(90deg,var(--gold),var(--gold-hi))}
/* 战场 */
.stage{position:relative;height:340px;background:#efe6d3;border-radius:18px;overflow:hidden;border:1px solid #dfd4bd;background-image:linear-gradient(#e7dcc6 1px,transparent 1px),linear-gradient(90deg,#e7dcc6 1px,transparent 1px);background-size:44px 44px}
.stage .pause-note{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:8;background:rgba(31,59,94,.85);color:#fff;font-size:12px;padding:5px 14px;border-radius:20px;letter-spacing:1px;opacity:0;transition:opacity .2s;pointer-events:none}
.stage .pause-note.show{opacity:1}
.stage .pause-note .ico{display:inline-block;margin-right:6px}
/* 路径条 */
.lane-tube{position:absolute;left:0;right:0;top:132px;height:120px;pointer-events:none}
.lane-tube .tube-bg{position:absolute;left:-40px;right:-40px;top:44px;height:52px;background:linear-gradient(180deg,#d9c9a6,#cbb98f);border-radius:16px;box-shadow:inset 0 4px 8px rgba(80,55,10,.28)}
.lane-tube .tube-edge{position:absolute;left:-40px;right:-40px;top:44px;height:52px;border:2px dashed rgba(120,90,20,.5);border-radius:16px;border-top:none;border-bottom:none}
/* 玩家 */
.player{position:absolute;left:14px;top:150px;z-index:6;transition:left .9s ease;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.player .p-body{width:54px;height:54px;border-radius:50% 50% 46% 46%;background:linear-gradient(160deg,#3d6ea8,#23426a);position:relative}
.player .p-face{position:absolute;inset:0;font-size:26px;line-height:56px;text-align:center}
.player .p-shadow{position:absolute;left:2px;top:56px;width:50px;height:10px;border-radius:50%;background:rgba(60,35,10,.28);filter:blur(3px)}
.player.walk{left:calc(100% - 90px)}
/* 宝箱 */
.treasure{position:absolute;right:12px;top:150px;z-index:5;text-align:center;pointer-events:none;transition:transform .6s}
.treasure .t-box{width:52px;height:44px;border-radius:8px;background:linear-gradient(180deg,#e6b24a,#b07f1f);position:relative;box-shadow:0 8px 14px rgba(0,0,0,.25)}
.treasure .t-box::before{content:"";position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:34px;height:18px;background:linear-gradient(180deg,#f0cd6a,#c08a3e);border-radius:7px 7px 4px 4px}
.treasure .t-lock{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:14px;height:16px;background:#7a5a12;border-radius:3px}
.treasure .t-lock::before{content:"";position:absolute;left:-4px;top:-6px;width:22px;height:8px;border:3px solid #7a5a12;border-bottom:none;border-radius:10px 10px 0 0}
.treasure .t-label{font-size:11px;color:#8a6a1f;font-weight:700;margin-top:10px;letter-spacing:1px}
.treasure.open .t-box{animation:openChest .6s ease forwards}
.treasure.open .t-label{color:#3d9a55}
@keyframes openChest{0%{transform:scale(1)}40%{transform:scale(1.2) rotate(-4deg)}100%{transform:scale(1)}}
/* 敌人 */
.enemy{position:absolute;z-index:4;cursor:pointer;user-select:none;transition:opacity .25s;filter:drop-shadow(0 5px 9px rgba(0,0,0,.22))}
.enemy .ebody{position:relative;width:54px;height:54px;transition:transform .15s}
.enemy:active .ebody{transform:scale(.9)}
.enemy .ebody svg{display:block}
.enemy .role-badge{position:absolute;top:-6px;right:-8px;width:20px;height:20px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.enemy .ename{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:#6b5a33;background:rgba(255,255,255,.85);padding:1px 7px;border-radius:8px;border:1px solid #e0d4b8}
.enemy.inactive{opacity:.28;cursor:default;filter:grayscale(.6)}
.enemy.inactive .ebody{animation:none}
.enemy.targeted .ebody{animation:targetPulse .8s ease-in-out infinite}
.enemy.dying{pointer-events:none}
.enemy.dying .ebody{animation:burst .5s ease forwards}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.stage{animation:none}
@keyframes targetPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(246,198,92,0))}50%{filter:drop-shadow(0 0 12px rgba(246,198,92,.9))}}
@keyframes burst{0%{transform:scale(1);opacity:1}30%{transform:scale(1.35);opacity:1}100%{transform:scale(.1);opacity:0}}
/* 箭 */
.arrow{position:absolute;z-index:5;pointer-events:none;transition:none}
.arrow .a-body{width:34px;height:10px;background:linear-gradient(90deg,#8a2c2c,#c04a4a);border-radius:2px;position:relative}
.arrow .a-body::after{content:"";position:absolute;right:-9px;top:-2px;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:10px solid #d3d3d3}
.arrow .a-body::before{content:"";position:absolute;left:-8px;top:2px;width:8px;height:3px;background:#e8e0cf;border-radius:2px}
/* 敌人 SVG 颜色类 */
.enemy.blue .ebody{filter:drop-shadow(0 5px 9px rgba(31,95,125,.35))}
.enemy.orange .ebody{filter:drop-shadow(0 5px 9px rgba(184,102,18,.35))}
.enemy.red .ebody{filter:drop-shadow(0 5px 9px rgba(169,52,52,.35))}
/* ===== 破解弹窗 ===== */
.solve-mask{position:fixed;inset:0;background:rgba(20,25,35,.6);backdrop-filter:blur(2px);z-index:70;display:flex;align-items:center;justify-content:center;padding:14px;animation:viewIn .2s ease both}
.solve-mask.hide{display:none}
.solve-card{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:20px;padding:18px 16px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.solve-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.solve-head .sh-e{width:40px;height:40px;flex:none}
.solve-head .sh-info{flex:1;min-width:0}
.solve-head .sh-tag{font-size:11px;color:#fff;padding:2px 8px;border-radius:10px;font-weight:600}
.solve-head .sh-title{font-size:13px;color:var(--muted);margin-top:3px}
.solve-toggle{display:flex;background:#f1ece1;border-radius:10px;padding:3px;margin-bottom:12px}
.solve-toggle .tg{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;font-weight:600;transition:all .15s}
.solve-toggle .tg.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.clue-area{min-height:90px;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fbf9f4;display:flex;flex-direction:column;justify-content:center}
.clue-en{font-size:18px;line-height:1.8;color:#1f2937}
.clue-cn{font-size:14px;color:#6b7280;margin-top:8px}
.clue-blank{display:inline-block;border-bottom:2px solid var(--navy);text-align:center;font-weight:700;padding:0 8px;min-width:60px;color:var(--navy)}
.phon-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.phon-btn{background:#eff6ff;color:#3b82f6;border:none;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.phon-btn.played{background:#dbeafe}
.phon-txt{font-size:14px;color:#3b82f6;font-family:"Lucida Sans Unicode",sans-serif;display:none}
.solve-fb{min-height:26px;font-size:13px;margin:6px 0 10px;padding:8px 10px;border-radius:10px;display:none}
.solve-fb.ok{display:block;background:#d1fae5;color:#065f46}
.solve-fb.err{display:block;background:#fee2e2;color:#991b1b}
.solve-fb.err b{color:#7f1d1d}
.keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.key{height:44px;line-height:44px;text-align:center;background:#f3f4f6;border:none;border-radius:10px;font-size:18px;font-weight:600;color:#374151;cursor:pointer;user-select:none;padding:0}
.key:active{background:#dbeafe}
.key.del{background:#fee2e2;color:#991b1b;font-size:20px}
.key.confirm{background:var(--navy);color:#fff;font-size:14px;grid-column:1/-1}
.solve-actions{display:flex;gap:10px;margin-top:12px}
.solve-actions .sa{flex:1;padding:12px;border-radius:12px;font-size:14px;cursor:pointer;font-weight:600}
.sa.abandon{background:#fff;color:#8a8375;border:1px solid var(--line)}
.sa.retry{background:#fff;color:var(--navy);border:2px solid var(--navy)}
/* ===== 过关 / 失败 ===== */
.result-card{text-align:center;padding:26px 18px}
.result-card .r-icon{font-size:52px;line-height:1;margin-bottom:6px}
.result-card .r-title{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:6px}
.result-card .r-sub{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.8}
.result-card .r-stats{display:flex;justify-content:center;gap:26px;margin-bottom:20px}
.result-card .r-stat .rv{font-size:26px;font-weight:800;color:var(--gold)}
.result-card .r-stat .rl{font-size:11px;color:var(--muted);margin-top:2px}
.result-card .r-btn{display:inline-block;min-width:150px;padding:14px 22px;border-radius:14px;border:none;font-size:15px;font-weight:800;color:#fff;cursor:pointer;letter-spacing:1px;box-shadow:0 8px 20px rgba(0,0,0,.16)}
.result-card .r-btn:active{transform:scale(.97)}
/* 复习视图 */
.rev-note{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.8;background:#faf8f3;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
/* 通用 */
.hide{display:none !important}
/* 红光 / 粒子 */
#redOverlay{position:fixed;inset:0;pointer-events:none;z-index:90;background:rgba(214,69,69,0)}
#redOverlay.flashing{animation:redFlash .5s ease-in-out 2}
@keyframes redFlash{0%,55%,100%{background:rgba(214,69,69,0)}25%,80%{background:rgba(214,69,69,.32)}}
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.part{position:absolute;font-size:18px;animation:partFly 1.1s ease-out forwards}
@keyframes partFly{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
.confetti{position:absolute;animation:confFall 1.6s ease-in forwards}
@keyframes confFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(120vh) rotate(360deg);opacity:0}}
@media (min-width:768px){
  .legend-grid{grid-template-columns:repeat(3,1fr)}
  .container{padding:20px 16px 50px}
  .stage{height:380px}
  .lv-map{grid-template-columns:repeat(8,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<header class="header">
  <h1><span class="t-crown">👑</span>单词夺宝</h1>
  <div id="headerInfo"></div>
</header>

<div class="world-tabs" id="worldTabs">
  <div class="world-tab active" data-w="basic" onclick="setWorld('basic')"><div class="wlabel">蓝 · 基础</div><div class="wsub">堵路之敌</div><div class="wbar"></div></div>
  <div class="world-tab" data-w="core" onclick="setWorld('core')"><div class="wlabel">橙 · 核心</div><div class="wsub">追击之敌</div><div class="wbar"></div></div>
  <div class="world-tab" data-w="extra" onclick="setWorld('extra')"><div class="wlabel">红 · 拓展</div><div class="wsub">冷箭之敌</div><div class="wbar"></div></div>
</div>

<div class="container">
  <!-- ===== 总览视图 ===== -->
  <section id="viewOverview" class="view"></section>

  <!-- ===== 战斗视图 ===== -->
  <section id="viewBattle" class="view hide">
    <div class="battle-top">
      <span class="bt-title" id="btTitle">夺宝 · 第1关</span>
      <span class="spacer"></span>
      <button class="iconbtn" onclick="battleBack()" title="返回">✕</button>
    </div>

/* ===== 匹配逻辑（沿用原功能：句中/释义） ===== */
const IRREG={found:'find',sent:'send',bought:'buy',became:'become',won:'win',stole:'steal',caught:'catch',fought:'fight',paid:'pay',overslept:'oversleep',got:'get',fell:'fall',made:'make',took:'take',gave:'give',did:'do',went:'go',was:'be',were:'be',am:'be',is:'be',are:'be',bled:'bleed',cancelled:'cancel',clapped:'clap',nodded:'nod',led:'lead',built:'build',held:'hold',kept:'keep',left:'leave',met:'meet',read:'read',said:'say',saw:'see',spoke:'speak',stood:'stand',taught:'teach',thought:'think',came:'come',ran:'run',sang:'sing',sat:'sit',swam:'swim',wrote:'write',ate:'eat',drank:'drink',drove:'drive',rode:'ride',threw:'throw',wore:'wear',broke:'break',chose:'choose',drew:'draw',flew:'fly',grew:'grow',knew:'know',showed:'show',told:'tell',understood:'understand',woke:'wake',spent:'spend',felt:'feel',lost:'lose',heard:'hear',hurt:'hurt',cut:'cut',put:'put',let:'let',sold:'sell',teeth:'tooth',feet:'foot',men:'man',women:'woman',children:'child',leaves:'leaf'};
function wordVariants(w){
  w=w.toLowerCase(); const vs=[w];
  if(w.endsWith('y')&&w.length>1&&!'aeiou'.includes(w[w.length-2])){ vs.push(w.slice(0,-1)+'ies'); vs.push(w.slice(0,-1)+'ied'); }
  else if(w.endsWith('e')){ vs.push(w+'d'); vs.push(w.slice(0,-1)+'ing'); vs.push(w+'s'); }
  else { vs.push(w+'s'); vs.push(w+'es'); vs.push(w+'ed'); vs.push(w+'ing'); }
  if(w.length>=3&&'bcdfghjklmnpqrstvwxz'.includes(w[w.length-1])&&'aeiou'.includes(w[w.length-2])&&!'aeiou'.includes(w[w.length-3])){ vs.push(w+w[w.length-1]+'ed'); vs.push(w+w[w.length-1]+'ing'); }
  for(const ir in IRREG){ if(IRREG[ir]===w) vs.push(ir); }
  return [...new Set(vs)];
}
function wordPat(w){
  const wl=w.toLowerCase();
  if(wl==="sb's"||wl==="one's") return ["\\S+'s",'\\S+'];
  if(wl==='sb'||wl==='sb.') return ['\\S+'];
  if(wl==='doing') return ['\\w+ing','\\b'+w+'\\b'];
  return wordVariants(w).map(v=>'\\b'+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b');
}
function cartesian(arrays){ if(!arrays.length) return [[]]; const f=arrays[0],rest=arrays.slice(1),rc=cartesian(rest),out=[]; for(const x of f) for(const r of rc) out.push([x].concat(r)); return out; }
function phrasePats(w){
  if(w.indexOf('...')>=0){
    const parts=w.split('...').map(s=>s.trim()).filter(Boolean);
    const fp=parts[0].split(' ').map(wordPat), lp=parts[parts.length-1].split(' ').map(wordPat), out=[];
    for(const fc of cartesian(fp)) for(const lc of cartesian(lp)) out.push('\\b'+fc.join('\\s+')+'\\b(?:\\s+\\S+){0,2}\\s+\\b'+lc.join('\\s+')+'\\b');
    return out;
  }
  const words=w.split(' ');
  if(words.length===1) return wordPat(words[0]);
  const out=[];
  for(const combo of cartesian(words.map(wordPat))) out.push('\\b'+combo.join('\\s+')+'\\b');
  return out;
}
let _lastSeg='',_lastSegFirst=false;
function makeBlank(en,word){
  _lastSeg=''; _lastSegFirst=false;
  const pats=phrasePats(word);
  for(const p of pats){
    const re=new RegExp(p,'i'), m=re.exec(en);
    if(m){
      _lastSeg=m[0]; _lastSegFirst=/^[\s"'()]*$/.test(en.slice(0,m.index));
      const bw=(m[0].length+2)*14+20, reG=new RegExp(p,'gi');
      return en.replace(reG,'<span class="clue-blank" style="min-width:'+bw+'px">&nbsp;</span>');
    }
  }
  const bw2=(word.length+2)*14+20;
  return en+' <span class="clue-blank" style="min-width:'+bw2+'px">&nbsp;</span>';
}
function stripW(w){
  if(w.length<=4) return w;
  if(w.endsWith('ying')) return w.slice(0,-3)+'y';
  if(w.endsWith('ies')) return w.slice(0,-3)+'y';
  if(w.endsWith('es')) return w.slice(0,-2);
  if(w.endsWith('ed')) return w.slice(0,-2);
  if(w.endsWith('ing')) return w.slice(0,-3);
  if(w.endsWith('s')) return w.slice(0,-1);
  return w;
}
function canonical(s){ return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean).map(w=>IRREG[w]||stripW(w)).join(' '); }
function isCorrect(typed,w,seg){
  const tn=(typed||'').toLowerCase().replace(/\s+/g,' ').trim();
  if(!tn) return false;
  const wn=(w||'').toLowerCase().replace(/\s+/g,' ').trim();
  const sn=(seg||'').toLowerCase().replace(/\s+/g,' ').trim();
  if(tn===wn||tn===sn) return true;
  return canonical(tn)===canonical(wn)||canonical(tn)===canonical(sn);
}

    d.style.left=e.homeX+'px';
    d.style.top=(152+((e.id%3)-1)*22)+'px';
    d.innerHTML='<div class="ebody">'+enemySVG(e.color)+'</div>'
      +'<div class="role-badge">'+badgeSVG(e.color)+'</div>'
      +(e.active?'<div class="ename">'+ROLE_INFO[e.color].label+'</div>':'');
    d.onclick=()=>{ if(e.active && !B.over) openSolve(e); };
    lane.appendChild(d);
    e.el=d;
  });
  updateCam();
}
function badgeSVG(color){
  if(color==='blue') return '<svg width="13" height="13" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z" fill="#2E82A8"/><path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(color==='orange') return '<svg width="13" height="13" viewBox="0 0 24 24"><path d="M6 5l7 7-7 7M13 5l7 7-7 7" fill="none" stroke="#E8891C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return '<svg width="13" height="13" viewBox="0 0 24 24"><path d="M4 12l16-8-6 8 6 8z" fill="#D64545"/><path d="M6 12h14" stroke="#D64545" stroke-width="2"/></svg>';
}
function enemySVG(color){
  const p={ blue:{body:'#3f9bc4',dk:'#2a6f92',eye:'#16374a'},
            orange:{body:'#ef9836',dk:'#c4711c',eye:'#4a2b05'},
            red:{body:'#e05c5c',dk:'#b03c3c',eye:'#3a1010'} }[color];
  let brows='';
  if(color==='orange') brows='<path d="M13 22l9 5M41 22l-9 5" stroke="'+p.dk+'" stroke-width="3" stroke-linecap="round"/>';
  if(color==='red') brows='<path d="M11 19l11 2M43 19l-11 2" stroke="'+p.dk+'" stroke-width="3" stroke-linecap="round"/>';
  const mouth= color==='blue'
    ? '<path d="M21 39q6 3 12 0" stroke="'+p.dk+'" stroke-width="2.4" fill="none" stroke-linecap="round"/>'
    : '<path d="M21 38q6 5 12 0" stroke="'+p.dk+'" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
  return '<svg width="54" height="54" viewBox="0 0 54 54">'
    +'<ellipse cx="27" cy="30" rx="22" ry="19" fill="'+p.body+'"/>'
    +'<ellipse cx="27" cy="32" rx="16" ry="13" fill="'+p.dk+'" opacity=".16"/>'
    +'<circle cx="19" cy="27" r="4.6" fill="#fff"/><circle cx="35" cy="27" r="4.6" fill="#fff"/>'
    +'<circle cx="19" cy="28" r="2.6" fill="'+p.eye+'"/><circle cx="35" cy="28" r="2.6" fill="'+p.eye+'"/>'
    +brows+mouth+'</svg>';
}

function updateCam(){
  const stage=$('stage'); const sw=stage.clientWidth;
  const act=activeEnemies();
  if(!act.length) return;
  const minX=Math.min.apply(null,act.map(e=>e.x));
  const maxHome=150+(B.total-1)*104;
  B.camX=Math.max(0, Math.min(minX-130, maxHome-sw+40));
  $('lane').style.transform='translateX(-'+B.camX+'px)';
}

function loop(t){
  if(!B||B.over) return;
  const dt=Math.min(0.05,(t-(B.lastT||t))/1000); B.lastT=t;
  if(!B.paused) updateBattle(dt);
  B.raf=requestAnimationFrame(loop);
}
function updateBattle(dt){
  const act=activeEnemies();
  let changed=false;
  act.forEach(e=>{
    if(e.color==='orange'){           // 追击
      e.x-=CHASE_SPEED*dt;
      if(e.x<56){ hitPlayer('orange'); e.x=Math.max(e.homeX, 56+420); }
      changed=true;
    } else if(e.color==='red'){       // 放冷箭
      e.fireT-=dt;
      if(e.fireT<=0 && e.homeX>90){ spawnArrow(e); e.fireT=12+Math.random()*5; }
    }
  });
  // 箭矢前进
  B.arrows=B.arrows.filter(a=>a.alive);
  B.arrows.forEach(a=>{
    a.x-=ARROW_SPEED*dt; a.el.style.transform='translateX('+(a.x-a.baseX)+'px)';
    if(a.x<46){ a.alive=false; a.el.remove(); hitPlayer('arrow'); }
  });
  // 更新敌人位置（追击者沿路径移动）
  act.forEach(e=>{ if(e.el) e.el.style.transform='translateX('+(e.x-e.homeX)+'px)'; });
  if(changed) updateCam();
}
function spawnArrow(e){
  const lane=$('lane');
  const d=document.createElement('div'); d.className='arrow';
  d.style.left=(e.x-10)+'px'; d.style.top=(152+((e.id%3)-1)*22+8)+'px';
  d.innerHTML='<div class="a-body"></div>';
  lane.appendChild(d);
  B.arrows.push({x:e.x-10,baseX:e.x-10,el:d,alive:true});
}
function hitPlayer(kind){
  if(B.over) return;
  if(performance.now()<B.graceUntil) return;   // 开局保护期
  B.hearts--; renderHud();
  flashRed();
  const stage=$('stage'); stage.style.animation='none'; void stage.offsetWidth; stage.style.animation='shake .4s ease';
  playErr();
  if(B.hearts<=0){ failLevel(); }
}
function flashRed(){ const o=$('redOverlay'); o.classList.remove('flashing'); void o.offsetWidth; o.classList.add('flashing'); setTimeout(()=>o.classList.remove('flashing'),1100); }

function failLevel(){
  B.over=true; B.paused=true; cancelAnimationFrame(B.raf);
  hidePanel();
  const acc=B.correct+B.wrong>0?Math.round(B.correct/(B.correct+B.wrong)*100):0;
  $('viewFail').innerHTML='<div class="card result-card">'
    +'<div class="r-icon">💔</div><div class="r-title">本关失败</div>'
    +'<div class="r-sub">3 颗心已耗尽。<br>这一路你击破了 <b>'+B.defeated+'</b> 个敌人，再试一次，把剩下单词夺回来。</div>'
    +'<div class="r-stats"><div class="r-stat"><div class="rv">'+B.defeated+'</div><div class="rl">击破</div></div>'
    +'<div class="r-stat"><div class="rv">'+acc+'%</div><div class="rl">正确率</div></div></div>'
    +'<button class="r-btn" style="background:var(--navy)" onclick="retryLevel()">再试一次</button>'
    +'<button class="r-btn" style="background:#8a8375;margin-left:10px" onclick="battleBack()">返回</button>'
    +'</div>';
  showView('fail');
}
function retryLevel(){ const lv=B?B.levelIdx:(clearedMap[world]||0); B=null; playLevel(lv); }

function clearLevel(){
  B.over=true; B.paused=true; cancelAnimationFrame(B.raf);
  const lv=B.levelIdx;
  clearedMap[world]=Math.max(clearedMap[world]||0, lv+1); saveCleared(world);
  $('player').classList.add('walk');
  $('treasure').classList.add('open');
  confetti();
  const acc=B.correct+B.wrong>0?Math.round(B.correct/(B.correct+B.wrong)*100):0;
  const sec=Math.round((Date.now()-B.startTime)/1000);
  setTimeout(()=>{
    hidePanel();
    const hasNext= (clearedMap[world]||0) < worldTotal(world);
    $('viewClear').innerHTML='<div class="card result-card">'
      +'<div class="r-icon">🏆</div><div class="r-title">过关！夺到宝箱了</div>'
      +'<div class="r-sub">第'+(lv+1)+'关 · '+worldName(world)+'</div>'
      +'<div class="r-stats">'
      +'<div class="r-stat"><div class="rv">'+B.defeated+'/20</div><div class="rl">击破</div></div>'
      +'<div class="r-stat"><div class="rv">'+acc+'%</div><div class="rl">正确率</div></div>'
      +'<div class="r-stat"><div class="rv">'+sec+'s</div><div class="rl">用时</div></div>'
      +'</div>'
      +'<button class="r-btn" style="background:var(--gold)" onclick="'+(hasNext?('playLevel('+(lv+1)+')'):'renderOverview();showView(\'overview\')')+'">'+(hasNext?'下一关 · 继续夺宝':'全部通关 · 返回')+'</button>'
      +'<button class="r-btn" style="background:#8a8375;margin-left:10px" onclick="renderOverview();showView(\'overview\')">总览</button>'
      +'</div>';
    showView('clear');
    $('player').classList.remove('walk');
    $('treasure').classList.remove('open');
  },1100);
}

/* ================================================================
   破解弹窗
   ================================================================ */
function openSolve(e){
  if(B.over||B.paused) return;
  PANEL_MODE='battle';
  B.paused=true; B.current=e; e.solving=true;
  if(e.el) e.el.classList.add('targeted');
  $('pauseNote').classList.add('show');
  renderPanelHead(e.color,e.word);
  renderToggle(); renderClue(); renderKeyboard(); renderFeedback();
  $('solvePanel').classList.remove('hide');
}
function renderPanelHead(color,word){
  const r=ROLE_INFO[color];
  $('shE').innerHTML=enemySVG(color);
  const tag=$('shTag'); tag.textContent=r.label;
  tag.style.background=color==='blue'?'var(--blue)':color==='orange'?'var(--orange)':'var(--red)';
  $('shTitle').textContent='破解："'+word.w+'"';
}
function renderToggle(){
  $('solveToggle').innerHTML='<div class="tg'+(SOLVE_MODE==='sentence'?' on':'')+'" onclick="setSolveMode(\'sentence\')">句中记</div>'
    +'<div class="tg'+(SOLVE_MODE==='meaning'?' on':'')+'" onclick="setSolveMode(\'meaning\')">中文释义</div>';
}
function setSolveMode(m){
  SOLVE_MODE=m; if(B) B.solveMode=m;
  renderToggle(); renderClue(); renderFeedback(false);
}
function renderClue(){
  const t=targetWord(); if(!t) return;
  const w=t.word;
  if(SOLVE_MODE==='meaning'){
    const bw=(w.w.length+2)*14+22, isPh=w.w.indexOf(' ')>0;
    const ph=isPh?'<span style="display:inline-block;font-size:11px;color:#d97706;border:1px solid #d97706;border-radius:4px;padding:0 6px;margin-left:8px;font-weight:400">短语</span>':'';
    $('clueArea').innerHTML='<div class="clue-en" style="font-size:22px;font-weight:700;text-align:center">'+w.m+ph+'</div>'
      +'<div class="clue-cn" style="text-align:center;font-size:16px">（<span class="clue-blank" id="blankSpace" style="min-width:'+bw+'px">&nbsp;</span>）</div>';
    seg=''; segFirst=false;
  } else {
    const en=makeBlank(w.en,w.w); seg=_lastSeg; segFirst=_lastSegFirst;
    $('clueArea').innerHTML='<div class="clue-en">'+en+'</div><div class="clue-cn">'+w.cn+'</div>';
  }
  $('phonTxt').textContent=w.p; $('phonTxt').style.display='none';
  syncBlank();
}
let seg='',segFirst=false;
function syncBlank(){
  const b=$('blankSpace'); if(!b) return;
  if(!typed){ b.innerHTML='&nbsp;'; b.style.color=''; return; }
  b.innerHTML=typed;
  b.style.color=targetWord()&&isCorrect(typed,targetWord().word.w,seg)?'var(--gold-hi)':'var(--navy)';
}
let typed='', fbLock=false;
function renderKeyboard(){
  const rows=[['a','b','c','d','e','f','g'],['h','i','j','k','l','m','n'],['o','p','q','r','s','t','u'],['v','w','x','y','z']];
  let h='<div class="keyboard">';
  rows.forEach(r=>r.forEach(l=>h+='<button class="key" onclick="pressKey(\''+l+'\')">'+l+'</button>'));
  h+='<button class="key" onclick="pressSpace()">空格</button><button class="key del" onclick="delKey()">⌫</button>';
  h+='<button class="key confirm" onclick="check()">确认击破</button></div>';
  $('kbArea').innerHTML=h;
}
function pressKey(l){
  const t=targetWord(); if(!t||fbLock) return;
  if(typed.length>=t.word.w.length+2) return;
  if(!typed&&segFirst) typed+=l.toUpperCase(); else typed+=l.toLowerCase();
  syncBlank(); playKey(); renderFeedback(false);
}
function pressSpace(){ const t=targetWord(); if(!t||fbLock) return; if(typed.length>=t.word.w.length+2) return; typed+=' '; syncBlank(); playKey(); }
function delKey(){ if(fbLock) return; typed=typed.slice(0,-1); syncBlank(); playKey(); renderFeedback(false); }
function targetWord(){
  if(PANEL_MODE==='battle'&&B&&B.current) return B.current;
  if(PANEL_MODE==='review') return RVIEW&&RVIEW.current?RVIEW.current:{word:null};
  return null;
}
function speakTarget(){ const t=targetWord(); if(t&&t.word) speakText(t.word.w); $('phonTxt').style.display='inline-block'; }
function renderFeedback(show){
  const fb=$('solveFb');
  if(!show){ fb.className='solve-fb'; fb.innerHTML=''; return; }
  const t=targetWord();
  fb.className=fbLock?'solve-fb err':'solve-fb ok';
  fb.innerHTML=fbLock?('✗ 正确答案：<b>'+t.word.w+'</b>（'+t.word.m+'）  · 换种考法再试'):('✓ 击破！'+t.word.w);
  $('abandonBtn').textContent='先撤退'; $('retryBtn').textContent='换一种考法';
}
function check(){
  const t=targetWord(); if(!t||!t.word) return;
  const w=t.word;
  const g=curGrade();
  const ok=isCorrect(typed,w.w,seg);
  if(ok){ correctAnswer(); }
  else{
    if(PANEL_MODE==='battle'){ B.wrong++; }
    fbLock=true; renderFeedback(true);
    playErr(); flashRed();
    if(!review[g].has(w.w.toLowerCase())){ review[g].add(w.w.toLowerCase()); saveState(g); }
  }
}
function curGrade(){ return (PANEL_MODE==='battle'&&B&&B.current)?B.current.grade:world; }
function correctAnswer(){
  playOk(); fbLock=false; renderFeedback(true); // shows ✓
  const w=targetWord().word;
  const g=curGrade();
  if(!mastered[g].has(w.w.toLowerCase())){ mastered[g].add(w.w.toLowerCase()); learnedCount[g]=(learnedCount[g]||0)+1; saveState(g); }
  if(PANEL_MODE==='battle'){
    B.correct++;
    const e=B.current;
    setTimeout(()=>{
      shatterEnemy(e);
      typed=''; B.paused=false; B.current=null; $('pauseNote').classList.remove('show');
      hidePanel();
      renderHud();
    },450);
  } else { // review
    typed=''; hidePanel(); RVIEW.advance();
  }
}
function shatterEnemy(e){
  if(e.el){ e.el.classList.add('dying'); burst(e.homeX, 152+((e.id%3)-1)*22, e.color); }
  setTimeout(()=>{ e.alive=false; B.defeated++; renderHud();
    if(B.defeated>=B.total){ clearLevel(); return; }
    renderLane();
  },500);
}
function abandonSolve(){
  if(PANEL_MODE==='battle'&&B){
    if(B.current&&B.current.el) B.current.el.classList.remove('targeted');
    typed=''; B.paused=false; B.current=null; $('pauseNote').classList.remove('show'); hidePanel();
  }
  else if(PANEL_MODE==='review'){ typed=''; hidePanel(); RVIEW&&RVIEW.finish(); }
}
function retrySolve(){
  const t=targetWord();
  if(!t||!t.word) return;
  setSolveMode(SOLVE_MODE==='sentence'?'meaning':'sentence');
  typed=''; fbLock=false; renderFeedback(false); syncBlank();
  speakTarget();
}
function hidePanel(){ $('solvePanel').classList.add('hide'); }

/* ================================================================
   复习（错词）
   ================================================================ */
let RVIEW=null;
function startReview(){
  const arr=[...(review[world]||[])];
  if(!arr.length){ toast('没有待复习的错词'); return; }
  PANEL_MODE='review';
  // 取词对象
  const lib=WORLD_CFG[world].data;
  const wmap={}; lib.forEach(o=>wmap[o.w.toLowerCase()]=o);
  const queue=shuffle(arr.filter(k=>wmap[k]).map(k=>wmap[k]));
  if(!queue.length){ toast('没有可复习的单词'); return; }
  RVIEW={ queue, current:null, advance(){ this.current=this.queue.shift()||null; if(!this.current){ this.finish(); } else this.show(); }, show(){ renderToggle(); renderClue(); renderKeyboard(); renderFeedback(false); $('solvePanel').classList.remove('hide'); }, finish(){ RVIEW=null; hidePanel(); renderOverview(); toast('复习完成'); } };
  const w=queue[0];
  $('shE').innerHTML=enemySVG(WORLD_CFG[world].color);
  const tag=$('shTag'); tag.textContent='复习 · '+GRADE_LABEL[world]; tag.style.background='var(--navy)';
  $('shTitle').textContent='错词巩固："'+w.w+'"（'+queue.length+' 个待复习）';
  RVIEW.advance();
}

/* ================================================================
   特效
   ================================================================ */
function burst(x,y,color){
  const fx=$('fxLayer'); const st=$('stage'); const sr=st.getBoundingClientRect();
  const cx=sr.left+x, cy=sr.top+y;
  const colors={blue:['#3f9bc4','#cfe9f5'],orange:['#ef9836','#fbe0c0'],red:['#e05c5c','#f7cfcf']}[color]||['#fff','#eee'];
  for(let i=0;i<16;i++){
    const p=document.createElement('div'); p.className='part'; p.textContent='✦';
    p.style.left=cx+'px'; p.style.top=cy+'px';
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*70;
    p.style.setProperty('--dx',Math.cos(ang)*dist+'px'); p.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    p.style.color=colors[i%2]; p.style.fontSize=(12+Math.random()*12)+'px';
    fx.appendChild(p); setTimeout(()=>p.remove(),1200);
  }
}
function confetti(){
  const fx=$('fxLayer');
  const cols=['#F6C65C','#E8891C','#3f9bc4','#e05c5c','#7fb069'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=(Math.random()*100)+'vw'; c.style.top='-10px';
    c.style.background=cols[i%5]; c.style.width=(6+Math.random()*8)+'px'; c.style.height=(10+Math.random()*8)+'px';
    c.style.borderRadius='2px'; c.style.animationDelay=(Math.random()*0.4)+'s';
    fx.appendChild(c); setTimeout(()=>c.remove(),2000);
  }
}

/* ================================================================
   初始化
   ================================================================ */
function initHeader(){
  const name=STUDENT_MAP[_auth]||localStorage.getItem('dd_name')||'同学';
  let masteredTotal=0; ['basic','core','extra'].forEach(g=>masteredTotal+=(mastered[g]||new Set()).size);
  $('headerInfo').innerHTML='<b>'+name+'</b>'+buildAchievements(masteredTotal)+'<span style="font-size:12px;color:rgba(255,255,255,.85);font-weight:600;margin-left:4px">'+masteredTotal+'</span>';
}
loadAll();
pullCloud().then(()=>{ initHeader(); renderOverview(); });
setTimeout(()=>{ initHeader(); renderOverview(); },120);
</script>
