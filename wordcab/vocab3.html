<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词夺宝 · 单词一扫光</title>
<style>
:root {
  --gold: #fbbf24;
  --gold-2: #f59e0b;
  --gold-deep: #d97706;
  --green: #10b981;
  --green-2: #059669;
  --blue: #38bdf8;
  --orange: #f97316;
  --red: #ef4444;
  --bg-0: #0b1220;
  --bg-1: #0f172a;
  --bg-2: #1b2540;
  --line: rgba(148,163,184,.16);
  --txt: #e2e8f0;
  --txt-dim: #94a3b8;
  --txt-mute: #64748b;
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --ease-out: cubic-bezier(.22,1,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg-0);
  color: var(--txt);
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* ================= HUD ================= */
.hud {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  background: linear-gradient(180deg, rgba(30,41,59,.98), rgba(15,23,42,.94));
  border-bottom: 1px solid var(--line);
  z-index: 20;
}
.level-badge {
  font-size: 13px; font-weight: 800; color: var(--gold);
  background: rgba(251,191,36,.12);
  border: 1px solid rgba(251,191,36,.32);
  border-radius: 8px; padding: 5px 10px; white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
}
.hp-wrap { flex: 1; max-width: 210px; }
.hp-bar {
  height: 12px; background: rgba(255,255,255,.08);
  border-radius: 6px; overflow: hidden;
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
}
.hp-fill {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #ef4444, #f97316, #22c55e);
  background-size: 210px 100%;
  transition: width .28s var(--ease-out);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
}
.hp-text { font-size: 10px; color: var(--txt-dim); text-align: center; margin-top: 2px; font-variant-numeric: tabular-nums; }
.enemy-count { font-size: 12px; color: var(--txt-dim); margin-left: auto; white-space: nowrap; }
.enemy-count b { color: #f87171; font-size: 14px; font-variant-numeric: tabular-nums; }

/* ================= 竞技场 ================= */
.arena {
  flex: 1 1 auto; position: relative; overflow: hidden;
  background: linear-gradient(180deg, #1e1b4b 0%, #312e81 34%, #3b0764 68%, #0f172a 100%);
}
.arena::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .85;
  background-image:
    radial-gradient(1.5px 1.5px at 18% 14%, rgba(255,255,255,.75) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 44% 7%, rgba(255,255,255,.5) 50%, transparent 50%),
    radial-gradient(1px 1px at 69% 19%, rgba(255,255,255,.6) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 86% 11%, rgba(255,255,255,.5) 50%, transparent 50%),
    radial-gradient(1px 1px at 10% 29%, rgba(255,255,255,.4) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 58% 27%, rgba(255,255,255,.5) 50%, transparent 50%),
    radial-gradient(1px 1px at 33% 21%, rgba(255,255,255,.45) 50%, transparent 50%),
    radial-gradient(1px 1px at 77% 33%, rgba(255,255,255,.4) 50%, transparent 50%);
}
.ground {
  position: absolute; left: 0; right: 0; bottom: 0; height: 14%;
  background: linear-gradient(180deg, rgba(49,46,129,.9) 0%, #1e1b4b 55%, #0c0a18 100%);
  border-top: 1px solid rgba(139,92,246,.3);
}
.ground::after {
  content: ''; position: absolute; top: -2px; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(167,139,250,.65), transparent);
}
.path-line {
  position: absolute;
  left: 50%; top: 6%; bottom: 6%; width: 2px;
  background-image: linear-gradient(180deg, rgba(167,139,250,.5) 50%, transparent 50%);
  background-size: 2px 14px;
  transform: translateX(-50%);
  opacity: .35;
  pointer-events: none;
  animation: pathFlow 1.4s linear infinite;
}
@keyframes pathFlow {
  from { background-position-y: 0; }
  to { background-position-y: -14px; }
}
.player {
  position: absolute;
  left: 50%; bottom: 8%;
  margin-left: calc(clamp(26px, 7vw, 42px) / -2);
  font-size: clamp(26px, 7vw, 42px);
  line-height: 1;
  z-index: 12;
  filter: drop-shadow(0 0 14px rgba(56,189,248,.6));
  transition: bottom .75s var(--ease-spring);
  animation: playerIdle 1.8s ease-in-out infinite;
  text-align: center;
}
@keyframes playerIdle {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-5px) scale(1.04); }
}
.player::after {
  content: '';
  position: absolute;
  left: 50%; top: -14px;
  margin-left: -7px;
  width: 0; height: 0;
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-bottom: 10px solid rgba(56,189,248,.75);
  animation: arrowUp 1s ease-in-out infinite;
}
@keyframes arrowUp {
  0%,100% { transform: translateY(0); opacity: .55; }
  50% { transform: translateY(-6px); opacity: 1; }
}

/* 用时标签 */
.timer-badge {
  position: absolute;
  left: 50%;
  top: 100%;
  transform: translateX(-50%);
  margin-top: 2px;
  font-size: 10px;
  font-weight: 800;
  line-height: 1;
  color: #7dd3fc;
  background: rgba(15,23,42,.9);
  border: 1px solid rgba(56,189,248,.4);
  border-radius: 999px;
  padding: 4px 9px;
  white-space: nowrap;
  letter-spacing: .3px;
  box-shadow: 0 2px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  pointer-events: none;
  font-variant-numeric: tabular-nums;
  font-family: inherit;
}

.treasure {
  position: absolute;
  left: 50%; bottom: 88%;
  margin-left: calc(clamp(26px, 7vw, 42px) / -2);
  font-size: clamp(26px, 7vw, 42px);
  line-height: 1;
  z-index: 11;
  filter: drop-shadow(0 0 14px rgba(251,191,36,.75));
  animation: treasureGlow 1.6s ease-in-out infinite;
}
@keyframes treasureGlow {
  0%,100% { filter: drop-shadow(0 0 10px rgba(251,191,36,.55)); transform: scale(1); }
  50% { filter: drop-shadow(0 0 24px rgba(251,191,36,1)); transform: scale(1.1); }
}

/* ================= 敌人 ================= */
.enemy {
  position: absolute;
  width: clamp(46px, 13vw, 68px);
  height: clamp(46px, 13vw, 68px);
  margin-left: calc(clamp(46px, 13vw, 68px) / -2);
  margin-bottom: calc(clamp(46px, 13vw, 68px) / -2);
  z-index: 10;
  cursor: pointer;
  transition: transform .12s;
  will-change: left, bottom;
}
.enemy:active { transform: scale(.9); }
.enemy-orb {
  width: 100%; height: 100%;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(20px, 5.5vw, 30px);
  animation: floatY 1.6s ease-in-out infinite;
  position: relative;
}
@keyframes floatY {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* 敌人身上极小中文释义角标 */
.enemy-tag {
  position: absolute;
  left: 50%;
  bottom: -7px;
  transform: translateX(-50%);
  font-size: clamp(8px, 2.2vw, 10px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: .1px;
  padding: 2px 5px;
  border-radius: 4px;
  white-space: nowrap;
  max-width: 76px;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  animation: none;
}
.enemy.blue .enemy-tag {
  color: #dff3ff;
  background: rgba(7,89,133,.88);
  border: 1px solid rgba(125,211,252,.55);
  box-shadow: 0 1px 4px rgba(0,0,0,.45);
}
.enemy.orange .enemy-tag {
  color: #ffe9d4;
  background: rgba(154,52,18,.9);
  border: 1px solid rgba(253,186,116,.55);
  box-shadow: 0 1px 4px rgba(0,0,0,.45);
}
.enemy.red .enemy-tag {
  color: #ffe0e0;
  background: rgba(127,29,29,.92);
  border: 1px solid rgba(252,165,165,.55);
  box-shadow: 0 1px 4px rgba(0,0,0,.45);
}

.enemy.blue .enemy-orb {
  background: radial-gradient(circle at 34% 30%, #7dd3fc, #0ea5e9 55%, #075985);
  box-shadow: 0 0 18px rgba(56,189,248,.75), inset 0 -5px 10px rgba(0,0,0,.35);
  border: 2px solid rgba(186,230,253,.6);
  animation: floatY 1.6s ease-in-out infinite, blueBreathe 1.4s ease-in-out infinite;
}
@keyframes blueBreathe {
  0%,100% { box-shadow: 0 0 14px rgba(56,189,248,.6), inset 0 -5px 10px rgba(0,0,0,.35); }
  50% { box-shadow: 0 0 28px rgba(56,189,248,1), inset 0 -5px 10px rgba(0,0,0,.35); }
}
.enemy.orange .enemy-orb {
  background: radial-gradient(circle at 34% 30%, #fdba74, #f97316 55%, #9a3412);
  box-shadow: 0 0 20px rgba(249,115,22,.8), inset 0 -5px 10px rgba(0,0,0,.35);
  border: 2px solid rgba(254,215,170,.6);
  animation: floatY 1.6s ease-in-out infinite, orangePulse 1s ease-in-out infinite;
}
@keyframes orangePulse {
  0%,100% { box-shadow: 0 0 20px rgba(249,115,22,.8), inset 0 -5px 10px rgba(0,0,0,.35); }
  50% { box-shadow: 0 0 32px rgba(249,115,22,1), inset 0 -5px 10px rgba(0,0,0,.35); }
}
.enemy.orange::after {
  content: '';
  position: absolute; inset: -9px;
  border-radius: 50%;
  border: 2px dashed rgba(251,146,60,.5);
  animation: spinRing 1.2s linear infinite;
  pointer-events: none;
}
@keyframes spinRing { to { transform: rotate(360deg); } }
.enemy.red .enemy-orb {
  background: radial-gradient(circle at 34% 30%, #fca5a5, #ef4444 55%, #7f1d1d);
  box-shadow: 0 0 22px rgba(239,68,68,.85), inset 0 -5px 10px rgba(0,0,0,.35);
  border: 2px solid rgba(254,202,202,.6);
  animation: floatY 1.6s ease-in-out infinite, redBreathe 1.3s ease-in-out infinite;
}
@keyframes redBreathe {
  0%,100% { box-shadow: 0 0 22px rgba(239,68,68,.85), inset 0 -5px 10px rgba(0,0,0,.35); }
  50% { box-shadow: 0 0 36px rgba(239,68,68,1), inset 0 -5px 10px rgba(0,0,0,.35); }
}
.enemy.red.aiming .enemy-orb {
  animation: floatY 1.6s ease-in-out infinite, aimPulse .4s ease-in-out infinite;
  filter: brightness(1.35);
}
@keyframes aimPulse {
  0%,100% { box-shadow: 0 0 22px rgba(239,68,68,.85); }
  50% { box-shadow: 0 0 42px rgba(239,68,68,1); }
}
.enemy.die { pointer-events: none; animation: dieBreak .42s forwards; }
@keyframes dieBreak {
  0% { transform: scale(1); opacity: 1; }
  40% { transform: scale(1.4); opacity: .95; filter: brightness(2.2); }
  100% { transform: scale(0); opacity: 0; }
}
.enemy.hit .enemy-orb { animation: hitShake .26s; }
@keyframes hitShake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* 瞄准线 */
.aim-line {
  position: absolute;
  height: 2px;
  pointer-events: none;
  z-index: 5;
  transform-origin: 0 50%;
  animation: aimBlink .5s ease-in-out infinite;
  border-radius: 1px;
}
.aim-line.aim-blue   { background: linear-gradient(90deg, rgba(56,189,248,.7), rgba(56,189,248,0)); }
.aim-line.aim-orange { background: linear-gradient(90deg, rgba(249,115,22,.8), rgba(249,115,22,0)); }
.aim-line.aim-red    { background: linear-gradient(90deg, rgba(239,68,68,.9), rgba(239,68,68,0)); height: 2.5px; }
@keyframes aimBlink {
  0%,100% { opacity: .22; }
  50% { opacity: .7; }
}

/* 投射物 */
.proj {
  position: absolute;
  width: 13px; height: 13px;
  margin-left: -6px; margin-bottom: -6px;
  border-radius: 50%;
  z-index: 8;
  pointer-events: none;
}
.proj.blue {
  background: radial-gradient(circle at 35% 32%, #bae6fd, #0ea5e9 60%, #075985);
  box-shadow: 0 0 16px rgba(56,189,248,1);
}
.proj.orange {
  background: radial-gradient(circle at 35% 32%, #fed7aa, #f97316 60%, #9a3412);
  box-shadow: 0 0 16px rgba(249,115,22,1);
  width: 15px; height: 15px;
  margin-left: -7px; margin-bottom: -7px;
}
.proj.red {
  background: radial-gradient(circle at 35% 32%, #fecaca, #ef4444 60%, #7f1d1d);
  box-shadow: 0 0 20px rgba(239,68,68,1);
  width: 16px; height: 16px;
  margin-left: -8px; margin-bottom: -8px;
}
.proj::before {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  width: 26px; height: 26px;
  margin: -13px 0 0 -13px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.35) 0%, transparent 70%);
  animation: projGlow .5s ease-in-out infinite;
}
@keyframes projGlow {
  0%,100% { transform: scale(.8); opacity: .5; }
  50% { transform: scale(1.4); opacity: 1; }
}

.dmg-pop, .heal-pop {
  position: absolute; font-size: 15px; font-weight: 800;
  pointer-events: none; z-index: 30;
  text-shadow: 0 2px 6px rgba(0,0,0,.85);
  animation: popRise .9s ease-out forwards;
  font-variant-numeric: tabular-nums;
}
.dmg-pop { color: #f87171; }
.heal-pop { color: #4ade80; }
@keyframes popRise {
  0% { transform: translateY(0) scale(.6); opacity: 0; }
  25% { transform: translateY(-14px) scale(1.15); opacity: 1; }
  100% { transform: translateY(-54px) scale(1); opacity: 0; }
}
.dmg-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 998;
  background: rgba(220,38,38,0);
}
.dmg-overlay.flash { animation: redFlash .5s ease-in-out; }
@keyframes redFlash {
  0%,100% { background: rgba(220,38,38,0); }
  35% { background: rgba(220,38,38,.35); }
}
.particle {
  position: fixed; pointer-events: none; z-index: 999;
  font-size: 16px; animation: partFly 1s ease-out forwards;
}
@keyframes partFly {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
}

/* ================= 底部提示 ================= */
.footer {
  flex: 0 0 auto;
  padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px));
  font-size: 11px;
  color: var(--txt-mute);
  text-align: center;
  background: rgba(15,23,42,.96);
  border-top: 1px solid var(--line);
}
.footer b { color: var(--txt-dim); }

/* =========================================================
   挑战弹窗
   ========================================================= */
.modal-mask {
  position: fixed; inset: 0; z-index: 500;
  background: radial-gradient(circle at 50% 100%, rgba(30,27,75,.6) 0%, rgba(2,6,23,.84) 62%);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .26s ease;
}
.modal-mask.show { opacity: 1; pointer-events: auto; }

.modal {
  position: relative;
  width: 100%; max-width: 560px;
  max-height: 92vh;
  overflow-y: auto;
  background: linear-gradient(180deg, #1b2540 0%, #0f172a 52%, #0b1220 100%);
  border-radius: 24px 24px 0 0;
  border: 1px solid rgba(148,163,184,.22);
  border-bottom: none;
  padding: 8px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -24px 70px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06);
  transform: translateY(100%);
  transition: transform .34s var(--ease-out);
  scrollbar-width: none;
}
.modal::-webkit-scrollbar { display: none; }
.modal-mask.show .modal { transform: translateY(0); }

.modal::before {
  content: '';
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  width: 74%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(56,189,248,.65), rgba(167,139,250,.65), transparent);
  pointer-events: none;
}
.modal::after {
  content: '';
  position: absolute; top: -30px; left: 50%;
  transform: translateX(-50%);
  width: 260px; height: 120px;
  background: radial-gradient(ellipse at center, rgba(129,140,248,.16) 0%, transparent 70%);
  pointer-events: none;
}

.modal-grip {
  width: 40px; height: 4px; border-radius: 2px;
  background: rgba(148,163,184,.3);
  margin: 4px auto 14px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.5);
}

/* 弹窗顶部 */
.modal-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.word-avatar {
  position: relative;
  width: 48px; height: 48px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  flex: 0 0 auto;
  animation: avatarFloat 2.4s ease-in-out infinite;
}
@keyframes avatarFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.word-avatar.blue {
  background: radial-gradient(circle at 34% 30%, #7dd3fc, #0ea5e9 55%, #075985);
  box-shadow: 0 0 16px rgba(56,189,248,.7), inset 0 -4px 8px rgba(0,0,0,.35);
  border: 2px solid rgba(186,230,253,.6);
}
.word-avatar.orange {
  background: radial-gradient(circle at 34% 30%, #fdba74, #f97316 55%, #9a3412);
  box-shadow: 0 0 18px rgba(249,115,22,.75), inset 0 -4px 8px rgba(0,0,0,.35);
  border: 2px solid rgba(254,215,170,.6);
}
.word-avatar.red {
  background: radial-gradient(circle at 34% 30%, #fca5a5, #ef4444 55%, #7f1d1d);
  box-shadow: 0 0 18px rgba(239,68,68,.8), inset 0 -4px 8px rgba(0,0,0,.35);
  border: 2px solid rgba(254,202,202,.6);
}

.word-meta {
  flex: 1;
  min-width: 0;
}

.word-meaning-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 3px;
}

.word-meaning {
  font-size: 17px;
  font-weight: 800;
  color: #f1f5f9;
  line-height: 1.35;
  letter-spacing: .2px;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.speak-btn {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid rgba(56,189,248,.4);
  background: rgba(56,189,248,.15);
  color: #7dd3fc;
  font-size: 13px;
  cursor: pointer;
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  transition: all .18s var(--ease-out);
  font-family: inherit;
  padding: 0;
}
.speak-btn:hover {
  background: rgba(56,189,248,.3);
  border-color: rgba(56,189,248,.7);
  transform: scale(1.08);
}
.speak-btn:active { transform: scale(.9); }
.speak-btn.playing {
  animation: speakPulse .6s ease-out;
}
@keyframes speakPulse {
  0% { box-shadow: 0 0 0 0 rgba(56,189,248,.6); }
  100% { box-shadow: 0 0 0 14px rgba(56,189,248,0); }
}

.word-phon {
  font-size: 12px;
  color: #7dd3fc;
  font-family: "Lucida Sans Unicode", "Segoe UI", sans-serif;
  letter-spacing: .3px;
  line-height: 1.3;
}
.word-phon:empty { display: none; }

/* 暂停提示小字 */
.word-pause-hint {
  font-size: 10px;
  color: rgba(148,163,184,.5);
  letter-spacing: .2px;
  line-height: 1.3;
  margin-top: 3px;
  font-weight: 400;
}

.modal-close {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid rgba(148,163,184,.25);
  background: rgba(148,163,184,.08);
  color: var(--txt-dim);
  font-size: 15px;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex: 0 0 auto;
  transition: all .22s var(--ease-out);
  font-family: inherit;
}
.modal-close:hover {
  background: rgba(239,68,68,.18);
  color: #fca5a5;
  border-color: rgba(239,68,68,.42);
  transform: rotate(90deg);
}
.modal-close:active { transform: rotate(90deg) scale(.9); }

/* 题目区 */
.q-area {
  margin-top: 2px;
  background: rgba(2,6,23,.42);
  border: 1px solid rgba(148,163,184,.1);
  border-radius: 16px;
  padding: 20px 18px;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: inset 0 2px 10px rgba(0,0,0,.28);
  position: relative;
  overflow: hidden;
}
.q-area::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(148,163,184,.18), transparent);
}
.q-en {
  font-size: clamp(16px, 4.4vw, 20px);
  line-height: 1.9;
  color: #e8edf5;
  margin-bottom: 10px;
  word-break: break-word;
  letter-spacing: .2px;
}
.q-cn {
  font-size: clamp(13px, 3.6vw, 14px);
  color: var(--txt-dim);
  margin-bottom: 2px;
}

.blank {
  display: inline-block;
  border-bottom: 2px solid var(--green);
  text-align: center;
  font-weight: 800;
  color: #f8fafc;
  padding: 0 10px;
  min-width: 90px;
  vertical-align: middle;
  min-height: 1.35em;
  letter-spacing: .6px;
  transition: color .15s, border-color .15s;
}
.blank .caret {
  display: inline-block;
  width: 2px;
  height: 1em;
  background: var(--green);
  vertical-align: -2px;
  margin-left: 1px;
  border-radius: 1px;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.feedback {
  margin-top: 14px;
  padding: 11px 15px;
  border-radius: 11px;
  font-size: 13px;
  line-height: 1.6;
  display: none;
}
.feedback.ok, .feedback.err {
  display: block;
  animation: fbIn .3s var(--ease-spring);
}
@keyframes fbIn {
  from { transform: translateY(8px) scale(.97); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}
.feedback.ok {
  background: linear-gradient(135deg, rgba(16,185,129,.16), rgba(5,150,105,.1));
  color: #6ee7b7;
  border: 1px solid rgba(16,185,129,.38);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}
.feedback.err {
  background: linear-gradient(135deg, rgba(239,68,68,.16), rgba(185,28,28,.1));
  color: #fca5a5;
  border: 1px solid rgba(239,68,68,.38);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}
.feedback b { color: #fff; font-size: 14px; letter-spacing: .3px; }

.keyboard {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-top: 18px;
}
.key {
  position: relative;
  height: 44px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(180deg, rgba(51,65,85,.92), rgba(30,41,59,.96));
  color: #e2e8f0;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.09), 0 2px 0 rgba(0,0,0,.38);
  transition: transform .08s ease, box-shadow .08s ease, background .15s ease, color .15s ease;
  font-family: inherit;
  overflow: hidden;
}
.key:active {
  transform: translateY(2px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 rgba(0,0,0,.38);
  background: linear-gradient(180deg, rgba(56,189,248,.4), rgba(30,64,110,.95));
  color: #fff;
}
.key.del {
  background: linear-gradient(180deg, rgba(127,29,29,.7), rgba(69,10,10,.92));
  color: #fca5a5;
  font-size: 17px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 0 rgba(0,0,0,.45);
}
.key.del:active {
  background: linear-gradient(180deg, rgba(239,68,68,.6), rgba(127,29,29,.95));
  color: #fff;
}
.key.space {
  grid-column: span 2;
  font-size: 12px;
  font-weight: 700;
  color: var(--txt-dim);
  letter-spacing: 1px;
}
.key.confirm {
  grid-column: span 6;
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: #fff;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 2px;
  box-shadow: 0 4px 16px rgba(16,185,129,.42), inset 0 1px 0 rgba(255,255,255,.28), 0 2px 0 rgba(3,84,58,.6);
}
.key.confirm:active {
  background: linear-gradient(135deg, #059669, #047857);
  box-shadow: 0 2px 8px rgba(16,185,129,.4), inset 0 1px 0 rgba(255,255,255,.2);
}
.key.confirm::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 10px;
  background: linear-gradient(110deg, transparent 32%, rgba(255,255,255,.35) 50%, transparent 68%);
  background-size: 220% 100%;
  background-position: 160% 0;
  animation: shineSweep 3.4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes shineSweep {
  0%, 55% { background-position: 160% 0; }
  100% { background-position: -60% 0; }
}

/* =========================================================
   结算弹窗
   ========================================================= */
.result-mask {
  position: fixed; inset: 0; z-index: 600;
  background: radial-gradient(circle at 50% 42%, rgba(30,27,75,.62) 0%, rgba(2,6,23,.9) 72%);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: 22px;
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease;
}
.result-mask.show { opacity: 1; pointer-events: auto; }

.result-card {
  position: relative;
  width: 100%;
  max-width: 362px;
  background: linear-gradient(180deg, #1b2540 0%, #0f172a 58%, #0b1220 100%);
  border: 1px solid rgba(251,191,36,.3);
  border-radius: 24px;
  padding: 30px 24px 24px;
  text-align: center;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.82), 0 0 70px rgba(251,191,36,.14), inset 0 1px 0 rgba(255,255,255,.08);
  transform: scale(.9) translateY(14px);
  opacity: 0;
  transition: transform .46s var(--ease-spring), opacity .32s ease;
}
.result-mask.show .result-card { transform: scale(1) translateY(0); opacity: 1; }
.result-card.lose {
  border-color: rgba(239,68,68,.36);
  box-shadow: 0 30px 80px rgba(0,0,0,.82), 0 0 70px rgba(239,68,68,.18), inset 0 1px 0 rgba(255,255,255,.08);
}
.result-rays {
  position: absolute;
  left: 50%; top: -14%;
  width: 400px; height: 400px;
  margin-left: -200px;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(251,191,36,.13) 0deg 7deg, transparent 7deg 21deg);
  animation: raysSpin 26s linear infinite;
  pointer-events: none;
  opacity: .75;
  -webkit-mask-image: radial-gradient(circle, #000 16%, transparent 68%);
  mask-image: radial-gradient(circle, #000 16%, transparent 68%);
}
.result-card.lose .result-rays {
  background: repeating-conic-gradient(from 0deg, rgba(239,68,68,.11) 0deg 7deg, transparent 7deg 21deg);
}
@keyframes raysSpin { to { transform: rotate(360deg); } }

.result-icon-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}
.result-icon-glow {
  position: absolute;
  width: 130px; height: 130px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(251,191,36,.45) 0%, transparent 64%);
  animation: glowPulse 2.6s ease-in-out infinite;
}
.result-card.lose .result-icon-glow {
  background: radial-gradient(circle, rgba(239,68,68,.42) 0%, transparent 64%);
}
@keyframes glowPulse {
  0%,100% { transform: scale(1); opacity: .65; }
  50% { transform: scale(1.18); opacity: 1; }
}
.result-icon {
  position: relative;
  font-size: 58px;
  line-height: 1;
  filter: drop-shadow(0 6px 18px rgba(251,191,36,.55));
}
.result-card.lose .result-icon { filter: drop-shadow(0 6px 18px rgba(239,68,68,.55)); }
.result-mask.show .result-icon {
  animation: iconPop .62s var(--ease-spring) .14s both;
}
@keyframes iconPop {
  0% { transform: scale(0) rotate(-28deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.result-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.5px;
  padding: 4px 13px;
  border-radius: 999px;
  margin-bottom: 9px;
  background: rgba(251,191,36,.13);
  color: var(--gold);
  border: 1px solid rgba(251,191,36,.36);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
}
.result-card.lose .result-badge {
  background: rgba(239,68,68,.13);
  color: #fca5a5;
  border-color: rgba(239,68,68,.36);
}

.result-title {
  font-size: 19px;
  font-weight: 900;
  margin-bottom: 12px;
  color: #f8fafc;
  letter-spacing: .3px;
}
.result-card.lose .result-title { color: #fecaca; }

.result-stars {
  display: flex;
  justify-content: center;
  gap: 7px;
  margin-bottom: 18px;
  min-height: 26px;
}
.result-star {
  font-size: 23px;
  line-height: 1;
  filter: drop-shadow(0 0 9px rgba(251,191,36,.75));
}
.result-mask.show .result-star {
  animation: starPop .5s var(--ease-spring) both;
}
.result-star.off {
  filter: grayscale(1) brightness(.36);
  opacity: .55;
}
@keyframes starPop {
  0% { transform: scale(0) rotate(-40deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.result-stats {
  display: flex;
  gap: 9px;
  margin-bottom: 20px;
}
.result-stat {
  flex: 1;
  background: linear-gradient(180deg, rgba(148,163,184,.1), rgba(148,163,184,.04));
  border-radius: 12px;
  padding: 11px 6px 9px;
  border: 1px solid rgba(148,163,184,.16);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
}
.result-mask.show .result-stat {
  animation: statIn .42s var(--ease-out) both;
}
.result-stat:nth-child(1) { animation-delay: .34s; }
.result-stat:nth-child(2) { animation-delay: .44s; }
.result-stat:nth-child(3) { animation-delay: .54s; }
@keyframes statIn {
  from { transform: translateY(10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.result-stat b {
  display: block;
  font-size: 21px;
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 3px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.5px;
}
.result-card.lose .result-stat b { color: #f87171; }
.result-stat span {
  font-size: 10px;
  color: var(--txt-mute);
  letter-spacing: .5px;
}

.result-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.btn-primary {
  position: relative;
  padding: 14px;
  border: none;
  border-radius: 13px;
  background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
  color: #1f1300;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
  overflow: hidden;
  font-family: inherit;
  box-shadow: 0 8px 26px rgba(245,158,11,.42), inset 0 1px 0 rgba(255,255,255,.45), 0 2px 0 rgba(146,64,14,.7);
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 13px;
  background: linear-gradient(110deg, transparent 34%, rgba(255,255,255,.5) 50%, transparent 66%);
  background-size: 220% 100%;
  background-position: 160% 0;
  animation: shineSweep 3.2s ease-in-out infinite;
  pointer-events: none;
}
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary:active {
  transform: translateY(2px) scale(.985);
  box-shadow: 0 3px 12px rgba(245,158,11,.4), inset 0 1px 0 rgba(255,255,255,.35);
}
.result-card.lose .btn-primary {
  background: linear-gradient(135deg, #f97316 0%, #dc2626 100%);
  color: #fff;
  box-shadow: 0 8px 26px rgba(239,68,68,.42), inset 0 1px 0 rgba(255,255,255,.3), 0 2px 0 rgba(127,29,29,.75);
}
.result-card.lose .btn-primary:active {
  box-shadow: 0 3px 12px rgba(239,68,68,.4), inset 0 1px 0 rgba(255,255,255,.2);
}

.btn-ghost {
  padding: 12px;
  border: 1px solid rgba(148,163,184,.28);
  border-radius: 13px;
  background: rgba(148,163,184,.06);
  color: var(--txt-dim);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .5px;
  cursor: pointer;
  font-family: inherit;
  transition: all .18s var(--ease-out);
}
.btn-ghost:hover {
  background: rgba(148,163,184,.13);
  color: #cbd5e1;
  border-color: rgba(148,163,184,.45);
}
.btn-ghost:active { transform: scale(.985); }

<script>
/* =========================================================
   1. 数据与存储
   ========================================================= */
const _auth = localStorage.getItem('dd_auth') || 'guest';

const GRADE_MAP = {
  basic: { data: (typeof WORDS_BASIC !== 'undefined' ? WORDS_BASIC : []), label: '基础', type: 'blue' },
  core:  { data: (typeof WORDS_CORE  !== 'undefined' ? WORDS_CORE  : []), label: '核心', type: 'orange' },
  extra: { data: (typeof WORDS_EXTRA !== 'undefined' ? WORDS_EXTRA : []), label: '拓展', type: 'red' }
};

const STORE_KEY = 'dd_vg4_' + _auth;

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const j = JSON.parse(raw);
      return {
        level: j.level || 1,
        mastered: j.mastered || { basic: [], core: [], extra: [] },
        bestHp: j.bestHp || 100
      };
    }

   2. 单词变体 / 挖空 / 判题
   ========================================================= */
const IRREG = {
  found:'find',sent:'send',bought:'buy',became:'become',won:'win',stole:'steal',caught:'catch',
  fought:'fight',paid:'pay',overslept:'oversleep',got:'get',fell:'fall',made:'make',took:'take',
  gave:'give',did:'do',went:'go',was:'be',were:'be',am:'be',is:'be',are:'be',bled:'bleed',
  cancelled:'cancel',clapped:'clap',nodded:'nod',led:'lead',built:'build',held:'hold',kept:'keep',
  left:'leave',met:'meet',read:'read',said:'say',saw:'see',spoke:'speak',stood:'stand',
  taught:'teach',thought:'think',came:'come',ran:'run',sang:'sing',sat:'sit',swam:'swim',
  wrote:'write',ate:'eat',drank:'drink',drove:'drive',rode:'ride',threw:'throw',wore:'wear',
  broke:'break',chose:'choose',drew:'draw',flew:'fly',grew:'grow',knew:'know',showed:'show',
  told:'tell',understood:'understand',woke:'wake',spent:'spend',felt:'feel',lost:'lose',
  heard:'hear',hurt:'hurt',cut:'cut',put:'put',let:'let',sold:'sell',
  teeth:'tooth',feet:'foot',men:'man',women:'woman',children:'child',leaves:'leaf'
};

function wordVariants(w) {
  w = w.toLowerCase();
  const vs = [w];
  if (w.endsWith('y') && w.length > 1 && !'aeiou'.includes(w[w.length - 2])) {
    vs.push(w.slice(0, -1) + 'ies');
    vs.push(w.slice(0, -1) + 'ied');
  } else if (w.endsWith('e')) {
    vs.push(w + 'd');
    vs.push(w.slice(0, -1) + 'ing');
    vs.push(w + 's');
  } else {
    vs.push(w + 's');
    vs.push(w + 'es');
    vs.push(w + 'ed');
    vs.push(w + 'ing');
  }
  if (w.length >= 3 && 'bcdfghjklmnpqrstvwxz'.includes(w[w.length - 1])
      && 'aeiou'.includes(w[w.length - 2]) && !'aeiou'.includes(w[w.length - 3])) {
    vs.push(w + w[w.length - 1] + 'ed');
    vs.push(w + w[w.length - 1] + 'ing');
  }
  for (const ir in IRREG) { if (IRREG[ir] === w) vs.push(ir); }
  return [...new Set(vs)];
}

function wordPat(w) {
  const wl = w.toLowerCase();
  if (wl === "sb's" || wl === "one's") return ["\\S+'s", '\\S+'];
  if (wl === 'sb' || wl === 'sb.') return ['\\S+'];
  if (wl === 'doing') return ['\\w+ing', '\\b' + w + '\\b'];
  return wordVariants(w).map(v => '\\b' + v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b');
}

function cartesian(arrays) {
  if (!arrays.length) return [[]];
  const f = arrays[0], rest = arrays.slice(1), rc = cartesian(rest), out = [];
  for (const x of f) for (const r of rc) out.push([x].concat(r));
  return out;
}

function phrasePats(w) {
  if (w.indexOf('...') >= 0) {
    const parts = w.split('...').map(s => s.trim()).filter(Boolean);
    const fp = parts[0].split(' ').map(wordPat);
    const lp = parts[parts.length - 1].split(' ').map(wordPat);
    const out = [];
    for (const fc of cartesian(fp)) for (const lc of cartesian(lp)) {
      out.push('\\b' + fc.join('\\s+') + '\\b(?:\\s+\\S+){0,2}\\s+\\b' + lc.join('\\s+') + '\\b');
    }
    return out;
  }
  const words = w.split(' ');
  if (words.length === 1) return wordPat(words[0]);
  const out = [];
  for (const combo of cartesian(words.map(wordPat))) {
    out.push('\\b' + combo.join('\\s+') + '\\b');
  }
  return out;
}

let _lastSeg = '';
let _lastSegFirst = false;

function makeBlank(en, word) {
  _lastSeg = '';
  _lastSegFirst = false;
  const pats = phrasePats(word);
  for (const p of pats) {
    const re = new RegExp(p, 'i');
    const m = re.exec(en);
    if (m) {
      _lastSeg = m[0];
      _lastSegFirst = /^[\s"'()]*$/.test(en.slice(0, m.index));
      const bw = (m[0].length + 2) * 14 + 20;
      const reG = new RegExp(p, 'gi');
      return en.replace(reG, '<span class="blank" id="blankSpace" style="min-width:' + bw + 'px"></span>');
    }
  }
  const bw2 = (word.length + 2) * 14 + 20;
  return en + ' <span class="blank" id="blankSpace" style="min-width:' + bw2 + 'px"></span>';
}

function stripW(w) {
  if (w.length <= 4) return w;
  if (w.endsWith('ying')) return w.slice(0, -3) + 'y';
  if (w.endsWith('ies')) return w.slice(0, -3) + 'y';
  if (w.endsWith('es')) return w.slice(0, -2);
  if (w.endsWith('ed')) return w.slice(0, -2);
  if (w.endsWith('ing')) return w.slice(0, -3);
  if (w.endsWith('s')) return w.slice(0, -1);
  return w;
}

function canonical(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/).filter(Boolean)
    .map(w => IRREG[w] || stripW(w)).join(' ');
}

function isCorrect(typed, w, seg) {
  const tn = (typed || '').toLowerCase().replace(/\s+/g, ' ').trim();
  if (!tn) return false;
  const wn = (w || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const sn = (seg || '').toLowerCase().replace(/\s+/g, ' ').trim();
  if (tn === wn || tn === sn) return true;
  return canonical(tn) === canonical(wn) || canonical(tn) === canonical(sn);
}

let _actx = null;
function ac() {
  if (!_actx) {
    try { _actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (_actx && _actx.state === 'suspended') _actx.resume();
  return _actx;
}

function beep(freq, dur, type, vol, delay) {
  const c = ac(); if (!c) return;
  const d = delay || 0;
  try {
    const t = c.currentTime + d;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .07, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}

function sweep(f1, f2, dur, type, vol) {
  const c = ac(); if (!c) return;
  try {
    const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || .06, t + .02);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickWords(pool, tier, n) {
  const mastered = (loadStore().mastered[tier] || []);
  const fresh = pool.filter(w => !mastered.includes((w.w || '').toLowerCase()));
  const old   = pool.filter(w =>  mastered.includes((w.w || '').toLowerCase()));

  const result = [];
  const a = shuffle(fresh), b = shuffle(old);
  while (result.length < n && a.length) result.push(a.pop());
  while (result.length < n && b.length) result.push(b.pop());
  let guard = 0;
  while (result.length < n && pool.length && guard++ < 200) {
    result.push(pool[Math.floor(Math.random() * pool.length)]);
  }
  return result;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function buildLevel(levelNum) {
  const blueWords   = pickWords(GRADE_MAP.basic.data, 'basic', COMPOSITION.blue);
  const orangeWords = pickWords(GRADE_MAP.core.data,  'core',  COMPOSITION.orange);
  const redWords    = pickWords(GRADE_MAP.extra.data, 'extra', COMPOSITION.red);

  const list = [];
  blueWords.forEach(w   => list.push({ word: w, type: 'blue',   tier: 'basic' }));
  orangeWords.forEach(w => list.push({ word: w, type: 'orange', tier: 'core'  }));
  redWords.forEach(w    => list.push({ word: w, type: 'red',    tier: 'extra' }));

  const mixed = shuffle(list);

  const cols = [12, 31, 50, 69, 88];
  const rows = [78, 66, 54, 42];

  mixed.forEach((e, i) => {
    const r = Math.floor(i / 5);
    const c = i % 5;
    const cfg = ENEMY_CFG[e.type];

    e.id = i;
    e.x = cols[c];
    e.y = rows[r % rows.length];
    e.homeX = e.x;
    e.homeY = e.y;

    e.alive = true;
    e.el = null;
    e.aimLine = null;

    e.speed = cfg.speed * (0.85 + Math.random() * 0.35);
    e.tx = e.x;
    e.ty = e.y;
    e.wanderTimer = 0;

    e.fireTimer = cfg.fireMin * (0.5 + Math.random() * 0.8);
    e.nextAimed = Math.random() < cfg.aimProb;
    e.aimingPlayer = false;
  });

  return mixed;
}

function syncEntities() {
  const W = arena.clientWidth || 1;
  const H = arena.clientHeight || 1;
  const px = PLAYER_X / 100 * W;
  const py = (1 - PLAYER_Y / 100) * H;

  for (const e of G.enemies) {
    if (!e.el) continue;
    if (!e.alive) {
      e.el.style.display = 'none';
      if (e.aimLine) e.aimLine.style.display = 'none';
      continue;
    }

    e.el.style.left = e.x + '%';
    e.el.style.bottom = e.y + '%';
    e.el.classList.toggle('aiming', e.aimingPlayer);

    if (e.aimLine) {
      if (e.aimingPlayer) {
        const ex = e.x / 100 * W;
        const ey = (1 - e.y / 100) * H;
        const lx = px - ex, ly = py - ey;
        const len = Math.hypot(lx, ly);
        const ang = Math.atan2(ly, lx) * 180 / Math.PI;
        e.aimLine.style.left = ex + 'px';
        e.aimLine.style.top = ey + 'px';
        e.aimLine.style.width = len + 'px';
        e.aimLine.style.transform = 'rotate(' + ang + 'deg)';
        e.aimLine.style.display = 'block';
      } else {
        e.aimLine.style.display = 'none';
      }
    }
  }

  for (const p of G.projectiles) {
    if (!p.el) continue;
    p.el.style.left = p.x + '%';
    p.el.style.bottom = p.y + '%';
  }
}

   ========================================================= */
function formatTime(ms) {
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return m > 0 ? ('用时' + m + '分' + s + '秒') : ('用时' + s + '秒');
}

function updateTimerDisplay() {
  const sec = Math.floor(G.elapsed / 1000);
  if (sec === _lastTimerSec) return;
  _lastTimerSec = sec;
  const el = document.getElementById('timerBadge');
  if (el) el.textContent = formatTime(G.elapsed);
}

function loop(ts) {
  const dt = Math.min((ts - (G.lastTs || ts)) / 1000, 0.05);
  G.lastTs = ts;

  if (G.running && !G.over) {
    G.elapsed = performance.now() - G.startTime;
    updateTimerDisplay();
  }

  if (G.running && !G.paused && !G.over) {
    update(dt);
  }
  syncEntities();
  requestAnimationFrame(loop);
}

function pickWanderTarget(e) {
  const cfg = ENEMY_CFG[e.type];
  if (e.type === 'blue') {
    e.tx = clamp(e.homeX + (Math.random() - 0.5) * 2 * cfg.wanderR, 8, 92);
    e.ty = clamp(e.homeY + (Math.random() - 0.5) * 12, cfg.yMin, cfg.yMax);
  } else {
    e.tx = clamp(8 + Math.random() * 84, 8, 92);
    e.ty = clamp(cfg.yMin + Math.random() * (cfg.yMax - cfg.yMin), cfg.yMin, cfg.yMax);
  }
}

function wanderEnemy(e, dt) {
  const dx = e.tx - e.x;
  const dy = e.ty - e.y;
  const d = Math.hypot(dx, dy);

  if (d < 1.2) {
    e.wanderTimer += dt;
    if (e.wanderTimer > 0.35) {
      e.wanderTimer = 0;
      pickWanderTarget(e);
    }
  } else {
    const sp = Math.min(e.speed * dt, d);
    e.x += dx / d * sp;
    e.y += dy / d * sp;
    e.wanderTimer = 0;
  }
  e.x = clamp(e.x, 6, 94);
  e.y = clamp(e.y, 36, 86);
}

function update(dt) {
  for (const e of G.enemies) {
    if (!e.alive) continue;

    wanderEnemy(e, dt);

    const cfg = ENEMY_CFG[e.type];
    e.fireTimer -= dt;
    e.aimingPlayer = e.nextAimed && e.fireTimer < 0.8 && e.fireTimer > 0;

    if (e.fireTimer <= 0) {
      spawnProjectile(e, e.nextAimed, cfg.projSpeed, cfg.projDmg, e.type);
      e.fireTimer = cfg.fireMin + Math.random() * (cfg.fireMax - cfg.fireMin);
      e.nextAimed = Math.random() < cfg.aimProb;
      e.aimingPlayer = false;
    }
  }

  for (const p of G.projectiles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const dx = p.x - PLAYER_X;
    const dy = p.y - PLAYER_Y;
    if (Math.hypot(dx, dy) < 4.5) {
      p.dead = true;
      damagePlayer(p.dmg, p);
    }
    if (p.x < -12 || p.x > 112 || p.y < -12 || p.y > 112) p.dead = true;
  }

  G.projectiles = G.projectiles.filter(p => {
    if (p.dead) { if (p.el) p.el.remove(); return false; }
    return true;
  });
}

function spawnProjectile(fromEnemy, aimed, speed, dmg, type) {
  let tx, ty;
  if (aimed) {
    tx = PLAYER_X;
    ty = PLAYER_Y;
  } else {
    tx = clamp(fromEnemy.x + (Math.random() - 0.5) * 110, -15, 115);
    ty = -12;
  }

  const dx = tx - fromEnemy.x;
  const dy = ty - fromEnemy.y;
  const d = Math.hypot(dx, dy) || 1;

  const p = {
    x: fromEnemy.x,
    y: fromEnemy.y,
    vx: dx / d * speed,
    vy: dy / d * speed,
    dmg: dmg || 6,
    dead: false,
    el: null
  };

  const el = document.createElement('div');
  el.className = 'proj ' + type;
  el.style.left = p.x + '%';
  el.style.bottom = p.y + '%';
  arena.appendChild(el);
  p.el = el;
  G.projectiles.push(p);

  beep(type === 'red' ? 480 : type === 'orange' ? 700 : 950, .05, 'square', .03);
}

const avatarEmoji = document.getElementById('avatarEmoji');
const wordMeaning = document.getElementById('wordMeaning');
const wordPhon = document.getElementById('wordPhon');
const speakBtn = document.getElementById('speakBtn');

let C = {
  enemy: null,
  typed: '',
  seg: '',
  segFirst: false,
  answered: false
};

function openChallenge(enemy) {
  G.paused = true;

  C.enemy = enemy;
  C.typed = '';
  C.seg = '';
  C.segFirst = false;
  C.answered = false;

  wordAvatar.className = 'word-avatar ' + enemy.type;
  avatarEmoji.textContent = EMOJI[enemy.type];
  wordMeaning.textContent = enemy.word.m || '';

  if (enemy.word.p && enemy.word.p.trim()) {
    wordPhon.textContent = enemy.word.p;
    wordPhon.style.display = 'block';
  } else {
    wordPhon.textContent = '';
    wordPhon.style.display = 'none';
  }

  fbEl.className = 'feedback';
  fbEl.textContent = '';

  renderQuestion();
  renderKeyboard();

  sfxOpen();
  modalMask.classList.add('show');
}

function closeChallenge(noSound) {
  if (!C.enemy && !modalMask.classList.contains('show')) return;
  if (!noSound) sfxClose();
  modalMask.classList.remove('show');
  C.enemy = null;
  G.paused = false;
}

function renderQuestion() {
  const e = C.enemy;
  if (!e) return;
  const w = e.word;

  const html = makeBlank(w.en || '', w.w);
  qArea.innerHTML =
    '<div class="q-en" id="qEn">' + html + '</div>' +
    '<div class="q-cn">' + (w.cn || '') + '</div>';
  C.seg = _lastSeg;
  C.segFirst = _lastSegFirst;
  updateBlank();
}

function renderKeyboard() {
  const rows = ['abcdefg', 'hijklmn', 'opqrstu', 'vwxyz'];
  let html = '';
  rows.forEach(r => {
    r.split('').forEach(l => {
      html += '<button class="key" data-key="' + l + '">' + l + '</button>';
    });
  });
  html += '<button class="key space" data-key=" ">空格</button>';
  html += '<button class="key del" data-act="del">⌫</button>';
  html += '<button class="key confirm" data-act="ok">确认</button>';
  keyboardEl.innerHTML = html;

  keyboardEl.querySelectorAll('[data-key]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (C.answered) return;
      pressChar(btn.dataset.key);
    });
  });
  keyboardEl.querySelector('[data-act="del"]').addEventListener('click', () => {
    if (C.answered) return;
    C.typed = C.typed.slice(0, -1);
    updateBlank(); sfxKey();
  });
  keyboardEl.querySelector('[data-act="ok"]').addEventListener('click', () => {
    if (C.answered) return;
    submitAnswer();
  });
}

function pressChar(ch) {
  if (!C.enemy) return;
  const maxLen = C.enemy.word.w.length + 2;
  if (C.typed.length >= maxLen) return;

  if (ch === ' ') {
    C.typed += ' ';
  } else if (!C.typed && C.segFirst) {
    C.typed += ch.toUpperCase();
  } else {
    C.typed += ch.toLowerCase();
  }
  updateBlank();
  sfxKey();
}

function updateBlank() {
  const b = document.getElementById('blankSpace');
  if (!b) return;
  if (!C.typed) {
    b.innerHTML = '<span class="caret"></span>';
    return;
  }
  const ok = isCorrect(C.typed, C.enemy.word.w, C.seg);
  b.innerHTML = escapeHtml(C.typed) + '<span class="caret"></span>';
  b.style.color = ok ? '#10b981' : '#e8edf5';
}

function submitAnswer() {
  const e = C.enemy;
  if (!e || !e.alive) return;

  const ok = isCorrect(C.typed, e.word.w, C.seg);
  G.answerCount++;

  if (ok) {
    G.correctCount++;
    C.answered = true;
    sfxGood();
    sfxBreak();

    e.alive = false;
    if (e.el) {
      e.el.classList.add('die');
      setTimeout(() => { if (e.el) e.el.style.display = 'none'; }, 440);
    }
    if (e.aimLine) e.aimLine.style.display = 'none';

    const color = e.type === 'blue' ? '#38bdf8' : e.type === 'orange' ? '#fb923c' : '#f87171';
    spawnParticles(e.x, e.y, color, 14);

    markMastered(e.tier, e.word.w.toLowerCase());
    G.killCount++;
    updateHUD();

    const healAmt = HEAL[e.type] || 0;
    healPlayer(healAmt);
    setTimeout(() => spawnParticles(e.x, e.y, '#4ade80', 8), 120);

    fbEl.className = 'feedback ok';
    fbEl.innerHTML = '✓ 正确！敌人已击破　<span style="color:#4ade80;font-weight:800">+' + healAmt + ' HP</span>';

    setTimeout(() => {
      closeChallenge(true);
      checkLevelClear();
    }, 460);

  } else {
    sfxBad();
    damagePlayer(9, e);
    if (e.el) {
      e.el.classList.add('hit');
      setTimeout(() => e.el && e.el.classList.remove('hit'), 320);
    }

    fbEl.className = 'feedback err';
    fbEl.innerHTML = '✗ 正确拼写：<b>' + escapeHtml(e.word.w) + '</b><br>' +
      '<span style="font-size:11px;opacity:.8">再试一次即可击破</span>';
  }
}

let _speakAudio = null;
function speakCurrent() {
  if (!C.enemy) return;
  try {
    if (!_speakAudio) _speakAudio = new Audio();
    _speakAudio.src = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(C.enemy.word.w) + '&type=1';
    _speakAudio.play().catch(() => {});
  } catch (e) {}

  if (speakBtn) {
    speakBtn.classList.remove('playing');
    void speakBtn.offsetWidth;
    speakBtn.classList.add('playing');
    setTimeout(() => speakBtn.classList.remove('playing'), 700);
  }
}

/* =========================================================
   10. 关卡管理
   ========================================================= */
function startLevel(levelNum) {
  G.level = levelNum;
  G.running = true;
  G.paused = false;
  G.over = false;
  G.hp = G.maxHp;
  G.enemies = [];
  G.projectiles = [];
  G.killCount = 0;
  G.answerCount = 0;
  G.correctCount = 0;

  /* 计时初始化 */
  G.startTime = performance.now();
  G.elapsed = 0;
  _lastTimerSec = -1;
  const tEl = document.getElementById('timerBadge');
  if (tEl) tEl.textContent = '用时0秒';

  clearEntities();

  const enemies = buildLevel(levelNum);
  G.enemies = enemies;
  enemies.forEach(createEnemyEl);

  document.getElementById('levelNum').textContent = levelNum;
  updateHUD();

  document.getElementById('resultMask').classList.remove('show');
  document.getElementById('resultCard').classList.remove('lose');

  const p = document.getElementById('player');
  p.style.left = PLAYER_X + '%';
  p.style.bottom = PLAYER_Y + '%';
}

function updateHUD() {
  const pct = Math.max(0, G.hp / G.maxHp * 100);
  document.getElementById('hpFill').style.width = pct + '%';
  document.getElementById('hpText').textContent = Math.round(G.hp);
  const left = G.enemies.filter(e => e.alive).length;
  document.getElementById('enemyLeft').textContent = left;
}

function checkLevelClear() {
  if (G.over) return;
  if (G.enemies.every(e => !e.alive)) {
    G.running = false;
    G.elapsed = performance.now() - G.startTime;
    updateTimerDisplay();
    const p = document.getElementById('player');
    p.style.bottom = (TREASURE_Y - 10) + '%';
    setTimeout(() => showResult(true), 850);
  }
}

function gameOver() {
  if (G.over) return;
  G.over = true;
  G.running = false;
  G.elapsed = performance.now() - G.startTime;
  setTimeout(() => showResult(false), 450);
}

function countUp(el, to, dur, suffix) {
  const start = performance.now();
  const sfx = suffix || '';
  function tick(now) {
    const p = Math.min((now - start) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * eased) + sfx;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function calcStars(win, acc, hp) {
  if (!win) return 0;
  if (acc >= 90 && hp >= 60) return 3;
  if (acc >= 70 || hp >= 30) return 2;
  return 1;
}

function showResult(win) {
  const mask = document.getElementById('resultMask');
  const card = document.getElementById('resultCard');
  const icon = document.getElementById('resultIcon');
  const badge = document.getElementById('resultBadge');
  const title = document.getElementById('resultTitle');
  const starsEl = document.getElementById('resultStars');
  const mainBtn = document.getElementById('resultMainBtn');
  const subBtn = document.getElementById('resultSubBtn');

  const acc = G.answerCount > 0 ? Math.round(G.correctCount / G.answerCount * 100) : 0;
  const hp = Math.round(G.hp);

  card.classList.toggle('lose', !win);

  const starCount = calcStars(win, acc, hp);
  let starsHtml = '';
  for (let i = 0; i < 3; i++) {
    const on = i < starCount;
    starsHtml += '<span class="result-star' + (on ? '' : ' off') + '" style="animation-delay:' + (0.45 + i * 0.12) + 's">★</span>';
  }
  starsEl.innerHTML = starsHtml;

  if (win) {
    icon.textContent = '🏆';
    badge.textContent = starCount === 3 ? '完美通关' : starCount === 2 ? '顺利通关' : '险胜通关';
    title.textContent = '第 ' + G.level + ' 关 · 夺宝成功';
    mainBtn.textContent = '进入第 ' + (G.level + 1) + ' 关';
    mainBtn.onclick = () => {
      sfxClick();
      const s = loadStore();
      s.level = Math.max(s.level, G.level + 1);
      saveStore(s);
      startLevel(G.level + 1);
    };
    subBtn.textContent = '重玩本关';
    subBtn.onclick = () => { sfxClick(); startLevel(G.level); };
  } else {
    icon.textContent = '💀';
    badge.textContent = 'HP 归零';
    title.textContent = '血量耗尽 · 挑战失败';
    mainBtn.textContent = '重试本关';
    mainBtn.onclick = () => { sfxClick(); startLevel(G.level); };
    subBtn.textContent = '返回第 1 关';
    subBtn.onclick = () => { sfxClick(); startLevel(1); };
  }

  document.getElementById('rsKill').textContent = '0';
  document.getElementById('rsAcc').textContent = '0%';
  document.getElementById('rsHp').textContent = '0';

  mask.classList.add('show');

  if (win) sfxWinFanfare(); else sfxLose();

  setTimeout(() => {
    countUp(document.getElementById('rsKill'), G.killCount, 600);
    countUp(document.getElementById('rsAcc'), acc, 700, '%');
    countUp(document.getElementById('rsHp'), hp, 800);
  }, 480);

  if (win && starCount > 0) {
    for (let i = 0; i < starCount; i++) {
      setTimeout(sfxStar, 480 + i * 130);
    }
  }
}

/* =========================================================
   11. 入口
   ========================================================= */
function startGame() {
  ac();
  sfxClick();
  document.getElementById('splashMask').classList.add('hide');
  startLevel(STORE.level || 1);
}

function resetProgress() {
  sfxClick();
  if (!confirm('确定要重置全部闯关进度吗？')) return;
  STORE = { level: 1, mastered: { basic: [], core: [], extra: [] }, bestHp: 100 };
  saveStore(STORE);
  alert('已重置，将从第 1 关开始');
  document.getElementById('levelNum').textContent = '1';
}

document.addEventListener('keydown', ev => {
  if (!modalMask.classList.contains('show')) return;
  if (C.answered) return;

  if (ev.key === 'Backspace') {
    ev.preventDefault();
    C.typed = C.typed.slice(0, -1);
    updateBlank(); sfxKey();
  } else if (ev.key === 'Enter') {
    ev.preventDefault();
    submitAnswer();
  } else if (ev.key === ' ') {
    ev.preventDefault();
    pressChar(' ');
  } else if (/^[a-zA-Z]$/.test(ev.key)) {
    pressChar(ev.key);
  }
});

document.addEventListener('click', function once() {
  ac();
  document.removeEventListener('click', once);
});

requestAnimationFrame(loop);

(function init() {
  document.getElementById('levelNum').textContent = STORE.level || 1;
  document.getElementById('hpFill').style.width = '100%';
  document.getElementById('hpText').textContent = '100';
  document.getElementById('enemyLeft').textContent = TOTAL_PER_LEVEL;
})();
</script>
