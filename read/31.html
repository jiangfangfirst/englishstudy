const box = document.getElementById('box');
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace( />/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDur(d){
  if(!d) return '';
  var m = Math.floor(d/60), s = Math.round(d - m*60);
  if(s===60){ m++; s=0; }
  return m+':'+('0'+s).slice(-2);
}
function renderBlock(b, color){
  var id = 'blk'+b.file.replace(/[^a-z0-9]/g,'');
  return '<div class="blk-row" id="'+id+'" data-file="'+esc(b.file)+'" data-title="'+esc(b.title)+'" onclick="playBlock(this)">' +
    '<span class="blk-main">' +
      '<span class="blk-name" style="color:'+color+'">'+esc(b.name)+'</span>' +
      '<span class="blk-sub">' +
        '<span class="blk-title">'+esc(b.title)+'</span>' +
        '<span class="blk-side">' +
          '<span class="blk-status"></span>' +
          '<span class="blk-dur">'+fmtDur(b.dur)+'</span>' +
        '</span>' +
      '</span>' +
    '</span>' +
  '</div>';
}
function renderUnits(){
  var h = '';
  // 单元选项卡（素色 + 选中色）
  h += '<div class="tabs">';
  UNITS.forEach(function(u, i){
    var n = i + 1;
    h += '<span class="tab'+(n===1?' active':'')+'" data-n="'+n+'" onclick="switchUnit('+n+')">'+u.un+'</span>';
  });
  h += '</div>';
  // 主区：单元名 + 该单元块列表
  h += '<div class="main-panel">' +
       '<div class="main-title"><span class="mt-en" id="mtEn"></span>' +
       '<span class="mt-name" id="mtName"></span><span class="mt-cn" id="mtCn"></span></div>' +
       '<div class="block-list" id="blockList"></div></div>';
  // 复习与附录：留在下方不动
  h += '<div class="extra-sec">';
  EXTRAS.forEach(function(e){
    h += '<div class="unit-card" id="ex'+e.file.replace(/[^a-z0-9]/g,'')+'">' +
      '<div class="unit-head" style="background:linear-gradient(135deg,'+e.c1+','+e.c2+')" onclick="toggleUnit(this)">' +
      '<span class="unum">'+e.tag+'</span><span class="utitle">'+e.title+'</span><span class="ucn">'+e.cn+'</span>' +
      '<span class="arrow">▾</span></div><div class="unit-body">' +
      renderBlock({name:e.tag, title:e.title, file:e.file, dur:e.dur}, e.c1) +
      '</div></div>';
  });
  h += '</div>';
  box.innerHTML = h;
  switchUnit(1);
}
var _curUnit = 1;
function switchUnit(n){
  _curUnit = n;
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active', (+t.dataset.n) === n);
  });
  var u = UNITS[n-1];
  document.getElementById('mtEn').textContent = u.un;
  document.getElementById('mtName').textContent = u.title;
  document.getElementById('mtCn').textContent = u.cn;
  var h = '';
  u.blocks.forEach(function(b){ h += renderBlock(b, u.c1); });
  document.getElementById('blockList').innerHTML = h;
  // ================= 重点：删掉原来这里 preloadAudio2 批量预加载！=================
}
function toggleUnit(head){
  var card = head.parentElement;
  if(card.classList.contains('open')){
    card.classList.remove('open');
    return;
  }
  // 手风琴单开：先收起其它已展开的单元
  document.querySelectorAll('.unit-card.open').forEach(function(c){
    if(c !== card) c.classList.remove('open');
  });
  card.classList.add('open');
  // ================= 重点：删掉附录展开时批量预加载！=================
}

// === 播放体系修改：点击才创建Audio实例 ===
var _cur = null;
var _paused = false;
var _blobCache = {};   // file -> blob URL
var _xhrCache = {};    // file -> 进行中的 XHR
var _audioCache = {};  // file -> Audio实例

// 仅点击的时候才创建Audio，只拿元信息，不预下载完整音频
function getAudioInstance(file){
  if(_audioCache[file]) return _audioCache[file];
  var a = new Audio('audio/' + file);
  a.preload = 'metadata';
  _audioCache[file] = a;
  return a;
}

function playBlock(row){
  var file = row.dataset.file;
  if(_cur && _cur.file === file){
    if(_cur.started){
      // 播放暂停切换
      if(_paused){
        _cur.audio.play().catch(function(){});
        _paused = false;
        row.classList.add('playing');
        setStatus(row, 'wav');
      } else {
        _cur.audio.pause();
        _paused = true;
        row.classList.remove('playing');
        setStatus(row, 'pause');
      }
    }
    return;
  }
  stopBlock();
  _cur = {file:file, audio:null, row:row, started:false, timer:null};
  row.classList.add('loading');
  row.querySelector('.blk-title').innerHTML = '<span class="loading-txt">加载中…</span>';

  var a2 = getAudioInstance(file);
  _cur.audio = a2;

  // 10秒超时保护，避免永久卡在加载中
  _cur.timer = setTimeout(function(){
    if(_cur && _cur.file === file && !_cur.started){
      loadFail(row);
    }
  },10000);

  bindPlay(a2, row);
  a2.play().catch(function(err){
    console.warn("播放异常:", err);
  });
}

function setStatus(row, kind){
  var st = row.querySelector('.blk-status');
  if(!st) return;
  if(kind === 'wav') st.innerHTML = '<span class="wav"><i></i><i></i><i></i></span>';
  else if(kind === 'pause') st.innerHTML = '<span class="paused-ic"><i></i><i></i></span>';
  else st.innerHTML = '';
}

function bindPlay(a, row){
  var file = row.dataset.file;
  a.onplaying = function(){ enterPlaying(row); };
  a.oncanplay = function(){ enterPlaying(row); };
  a.onended = function(){ resetBlock(); };
  a.onerror = function(){
    if(_blobCache[file]){
      var a2 = new Audio(_blobCache[file]);
      _cur.audio = a2;
      a2.onended = function(){ resetBlock(); };
      a2.onerror = function(){ loadFail(row); };
      a2.play().catch(function(){});
      enterPlaying(row);
      return;
    }
    loadFail(row);
  };
  a.onwaiting = function(){
    row.classList.add('loading');
    row.querySelector('.blk-title').innerHTML = '<span class="loading-txt">缓冲中…</span>';
  };
}

function enterPlaying(row){
  if(!_cur || _cur.row !== row || _cur.started) return;
  clearTimeout(_cur.timer);
  _cur.started = true;
  row.classList.remove('loading');
  row.classList.add('playing');
  setStatus(row, 'wav');
  finishTitle(row);
}

function finishTitle(row){
  var t = row.querySelector('.blk-title');
  if(t && t.querySelector('.loading-txt')) t.textContent = row.dataset.title;
}

function loadFail(row){
  if(!_cur || _cur.row !== row) return;
  clearTimeout(_cur.timer);
  row.classList.remove('loading');
  row.querySelector('.blk-title').innerHTML = '<span class="loading-txt">加载失败 · 点我重试</span>';
  setStatus(row, '');
  _cur = null;
  _paused = false;
}

function stopBlock(){
  if(_cur){
    clearTimeout(_cur.timer);
    try{ if(_cur.audio){ _cur.audio.pause(); _cur.audio.currentTime = 0; } }catch(e){}
    resetBlock();
  }
}

function resetBlock(){
  if(_cur){
    var row = _cur.row;
    row.classList.remove('loading','playing');
    var t = row.querySelector('.blk-title'); if(t) t.textContent = row.dataset.title;
    setStatus(row, '');
    _cur = null;
    _paused = false;
  }
}

renderUnits();

</script>
