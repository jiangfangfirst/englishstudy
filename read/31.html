<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;min-height:100vh;
    background:linear-gradient(-45deg,#ffdde1,#c2e9fb,#d4fc79,#fbc2eb,#a6c1ee,#f6d365);
    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
    color:#1f2937;
  }
  @keyframes gradientBG{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }
  .wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px}

  .hero{
    background:rgba(255,255,255,.75);backdrop-filter:blur(12px);
    border-radius:24px;padding:24px 20px;margin-bottom:18px;
    box-shadow:0 8px 32px rgba(255,107,157,.15);
    border:2px solid rgba(255,255,255,.8);
  }
  .hero h1{
    font-size:24px;font-weight:900;
    background:linear-gradient(90deg,#ff6b9d,#818cf8,#34d399,#fbbf24);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .hero .tip{margin-top:8px;font-size:13px;color:#6b7280}
  .hero .badge-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .hero .badge{
    display:inline-block;background:linear-gradient(90deg,#ff6b9d,#f472b6);
    color:#fff;font-size:11px;font-weight:700;padding:5px 14px;
    border-radius:999px;
  }
  .home-btn{display:inline-block;background:rgba(255,255,255,.85);color:#ff6b9d;font-size:13px;font-weight:700;padding:7px 16px;border-radius:999px;text-decoration:none;border:1.5px solid #ff6b9d}

  .unit-card{
    background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
    border-radius:20px;margin-bottom:14px;overflow:hidden;
    box-shadow:0 6px 24px rgba(0,0,0,.08);
    border:2px solid rgba(255,255,255,.9);
  }
  .unit-head{
    padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;
    color:#fff;font-weight:800;user-select:none;
    transition:transform .2s;
  }
  .unit-head:active{transform:scale(.98)}
  .unit-head .arrow{margin-left:auto;font-size:18px;transition:transform .3s}
  .unit-card.open .unit-head .arrow{transform:rotate(180deg)}
  .unit-head .unum{
    background:rgba(255,255,255,.3);padding:4px 12px;border-radius:999px;
    font-size:12px;font-weight:700;
  }
  .unit-head .utitle{font-size:17px}
  .unit-head .ucn{font-size:13px;font-weight:500;opacity:.9}

  .unit-body{display:none;padding:14px 14px 18px}
  .unit-card.open .unit-body{display:block;animation:fadeIn .3s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tab{
    padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:#f3f4f6;color:#6b7280;cursor:pointer;border:2px solid transparent;
    transition:.2s;white-space:nowrap;
  }
  .tab.active{color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}

  .pane{display:none}
  .pane.active{display:block;animation:fadeIn .25s}

  .sent-card{
    padding:10px 4px;border-bottom:1px dashed #e5e7eb;
  }
  .sent-card:last-child{border-bottom:none;}
  .play-all{display:block;margin:0 0 10px;padding:6px 18px;background:#fff;color:#10b981;border:1.5px solid #10b981;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer}
  .play-all.playing{background:#ecfdf5;color:#059669;border-color:#10b981}
  .sent-top{display:flex;justify-content:flex-start;margin-bottom:2px}
  .sent-play{
    background:#fff;color:#10b981;border:1.5px solid #10b981;
    padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .sent-play:active{transform:scale(.95)}
  .sent-play:disabled{opacity:.6;cursor:default}
  /* 播放中句子高亮 */
  .sent-card.playing{background:#fef3f2;border-radius:10px;}
  /* 声波动画 */
  .sent-play.playing{background:#fff;color:#059669;border-color:#10b981;}
  .sent-play.playing::after{
    content:'●●';
    letter-spacing:2px;
    font-size:8px;
    vertical-align:middle;
    animation:wave .6s ease-in-out infinite alternate;
  }
  @keyframes wave{
    0%{opacity:.3;}
    100%{opacity:1;}
  }

  .plus-one{
    display:inline-block;font-size:12px;font-weight:800;color:#10b981;margin-left:4px;
    animation:plusUp .8s ease-out forwards;
  }
  @keyframes plusUp{
    0%{opacity:1;transform:translateY(0) scale(1);}
    100%{opacity:0;transform:translateY(-28px) scale(1.3);}
  }

  .sent-text{font-size:18px;line-height:1.8;font-weight:500;color:#1f2937}
  .w{cursor:pointer;padding:1px 3px;border-radius:5px;border-bottom:2px dashed transparent;transition:.15s}
  .w:hover{background:#fef3c7;border-bottom-color:#f59e0b}
  .w.active{background:#dbeafe;border-bottom-color:#3b82f6}
  .pun{color:#9ca3af}

  .word-pop{
    margin-top:10px;background:linear-gradient(135deg,#fff7ed,#fef3c7);
    border:1px solid #fed7aa;border-radius:12px;padding:10px 12px;
    display:none;animation:fade .2s;
  }
  .word-pop.show{display:block}
  .wp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .wp-word{font-size:18px;font-weight:800;color:#ea580c}
  .wp-ph{font-size:13px;color:#92400e;font-family:ui-monospace,Menlo,monospace}
  .wp-pos{margin-top:5px;font-size:13px;color:#374151}
  .wp-pos b{color:#dc2626;font-style:italic;margin-right:6px}
  .wp-src{margin-top:3px;font-size:11px;color:#9ca3af}

  footer{margin-top:20px;text-align:center;color:#6b7280;font-size:12px;padding:10px}
</style>

<script>


const UNITS = [
  {unit:"Unit 1", title:"Making friends", cn:"交朋友", color:"#ff6b9d", grad:["#ff6b9d","#ffa8c5"], parts:[
    {part:"Let's talk A", sents:["Hello! I'm Mike Black.","Hi! My name is Wu Binbin.","Nice to meet you.","Nice to meet you too."]},

  {unit:"Unit 2", title:"Different families", cn:"不同的家庭", color:"#fbbf24", grad:["#fbbf24","#fde68a"], parts:[
    {part:"Let's talk A", sents:["Mum! Dad! This is my friend, Sarah Miller.","Hi, Sarah. This is my grandma.","This is my grandpa.","Nice to meet you."]},
    {part:"Let's learn", sents:["Hi, I'm Chen Jie. Look!","This is my family. This is my father.","This is my mother.","This is my sister.","This is me."]},
    {part:"Listen and chant", sents:["This is my mum. Hello, hello, hello!","This is my dad. Hi, hi, hi!","This is my sister. How are you?","This is my grandma. Nice to meet you.","This is my grandpa. How do you do?"]},
    {part:"Let's talk B", sents:["Sarah, you have a big family. Is this your sister?","No, it's my cousin.","Is that your brother?","Yes, it is."]},

  ]},
  {unit:"Unit 3", title:"Amazing animals", cn:"神奇的动物", color:"#34d399", grad:["#34d399","#a7f3d0"], parts:[
    {part:"Let's talk A", sents:["Good morning, Mike!","Good morning! Come in.","I like your dog.","Thanks. Do you have a pet?","No, I don't. Yes, I do. I have a cat."]},

    {part:"Listen and do", sents:["Run, run, run like a dog.","Sleep, sleep, sleep like a cat.","Sing, sing, sing like a bird.","Hop, hop, hop like a rabbit.","Swim, swim, swim like a fish."]},

    {part:"Let's learn B", sents:["It's a panda.","It's a monkey.","It's a tiger.","It's an elephant.","It's a lion."]},
    {part:"Listen and chant", sents:["What's this? It's an elephant.","What's this? It's a monkey.","What's this? It's a panda.","What's this? It's a lion!","What's this? It's a tiger! Run!"]},
    {part:"Start to read", sents:["The giraffe is tall!","The lion is fast!","The elephant is big!","The fish is small!","I like fish!"]},
    {part:"Project", sents:["Binbin, let's make a picture book about animals.","Good idea! I like elephants, lions and monkeys.","What about you, Mike?","I like fish, cats, rabbits, and birds.","This is my book. This is a monkey.","It's cute."]},
    {part:"Reading time", sents:["Fish are amazing.","Are we amazing, Dad?","Yes. We're big. But whale sharks are big too.","We're fast. But squids are fast too.","We can jump. But sea lions can jump too.","Aha! I know! We sing!","That's it! Our songs are special.","That is amazing!"]}

  {unit:"Unit 4", title:"Plants around us", cn:"我们身边的植物", color:"#a3e635", grad:["#a3e635","#d9f99d"], parts:[
    {part:"Let's talk A", sents:["Mike, do you like apples?","Yes, I do. And you?","No, I don't. I like bananas.","Do you like the farm?","Yes, Miss White. I like the fresh air."]},
    {part:"Ask and answer", sents:["Do you like apples?","Yes, I do."]},
    {part:"Let's learn", sents:["Do you like apples?","No, I don't. I like bananas.","I like oranges.","I like grapes."]},
    {part:"Listen and chant", sents:["Grapes are small. Bananas are long.","Apples and oranges make you strong.","Fresh air, flowers and leaves in spring."]},
    {part:"Let's talk B", sents:["The school gardens need help.","We can water the flowers.","We can water the grass.","Nice. And?","We can plant new trees."]},

    {part:"Let's learn B", sents:["Plants need our help.","Plants need air, water and sun."]},
    {part:"Listen and chant B", sents:["Air, water and sun.","These can all help plants grow.","Plant, water, cut and turn."]},
    {part:"Start to read", sents:["Plants can give us many things.","We need plants.","Plants need air, water and sun.","Can we help them?"]},
    {part:"Project", sents:["Do you like fruit, John?","Yes, I do. I like apples. What about you?","I like bananas very much.","I like oranges. Do you like oranges, Sarah?","No, I don't. I like grapes.","This is my garden.","The apple trees need air, water and sun."]},
    {part:"Reading time", sents:["I am an apple tree. My new family help me.","I need air, water and sun. My family water me.","It is cold. They help me.","My family like me. The flowers are so beautiful!","I love the fresh air.","I am big now. I give apples to my family. We are all happy!"]}
  ]},
  {unit:"Unit 5", title:"The colourful world", cn:"多彩的世界", color:"#818cf8", grad:["#818cf8","#c7d2fe"], parts:[
    {part:"Let's talk A", sents:["What colour is it? It's orange.","What colour is it? It's green.","Look! Red and blue make purple.","Wow!"]},
    {part:"Guess and check", sents:["What colour is it?","It's green.","Wow! Blue and yellow make green."]},
    {part:"Let's learn", sents:["The world is colourful!","a brown bear","a yellow duck","a purple flower","green grass","blue sea"]},

    {part:"Let's talk B", sents:["What colours do you like?","I like red and pink.","OK. Let's draw some red and pink flowers.","And the birds?","Let's draw some purple and brown birds.","Good idea!"]},
    {part:"Colour and say", sents:["What colours do you like?","I like green and yellow."]},
    {part:"Let's learn B", sents:["Colours are useful!","pink, orange, red, white, black"]},
    {part:"Listen and do", sents:["Black, black, sit down.","White, white, turn around.","Pink and red, touch the ground.","Orange and red, jump up and down."]},
    {part:"Start to read", sents:["Colours can talk!","It's red. Red can say No!","It's green. Green can say Go!","It's blue. Blue can say Use again!","It's yellow. Yellow can say Be careful!"]},
    {part:"Project", sents:["Look at my colour book.","It has green trees, green grass, and green grapes.","And black rabbits, black birds, and black cats.","What colors do you like?","I like pink, orange, blue, and yellow."]},
    {part:"Reading time", sents:["I am a sunflower. I am tall and green.","Then, I am green and yellow.","Now I am a big yellow flower. Bees come.","They are yellow and black. I give them food.","Now it is cold. I am green and brown.","I am gone. But my children grow."]}
  ]},
  {unit:"Unit 6", title:"Useful numbers", cn:"有用的数字", color:"#f472b6", grad:["#f472b6","#fbcfe8"], parts:[
    {part:"Let's talk A", sents:["Binbin, this is my brother, Sam.","Hi, Sam! This is my sister, Xinxin.","Hello, Xinxin!","Hi, Sam! How old are you?","I'm five years old.","Me too."]},
    {part:"Choose and role-play", sents:["Hello, Xiaoli! How old are you?","I'm five years old."]},
    {part:"Let's learn", sents:["one, two, three, four, five"]},
    {part:"Listen and chant", sents:["Jump! Jump! Jump! One, two, three!","Jump! Jump! Jump! Three, two, one!","Four and five! Jump up high!","Five! Four! Three, two, one! Jump! Jump! It's such fun!"]},
    {part:"Let's talk B", sents:["How many apples? Two.","How many bananas? Three. And one orange.","OK. I have ten yuan.","I have six yuan.","Great! Let's go to the shop!"]},
    {part:"Count and say", sents:["How many lions? Two."]},
    {part:"Let's learn B", sents:["That's ten yuan, please.","Here you are.","six, seven, eight, nine, ten"]},
    {part:"Listen and chant B", sents:["One head, two legs, ten toes. I am a child.","One head, eight eyes, eight legs. I am a spider.","One head, four wings, six legs. I am a bee."]},
    {part:"Start to read", sents:["It's seven o'clock. Hurry!","One orange, two apples and three bananas.","Three cuts. Let's eat!","Happy birthday!","Oh, one more cut for the dog."]},
    {part:"Project", sents:["Hi, Mike. Hi, Matt. This is my sister, Xinxin.","Hello, Xinxin. This is my brother, Matt.","Hi, Matt. How old are you?","I'm six.","I will be six soon. Please come to my birthday party.","Great!"]},
    {part:"Reading time", sents:["How many cards? Six.","What's this? Six. Right.","What's this? Hmm, six? You're right again.","What's this? It's six in Chinese.","What about this? I don't know.","It's six too. It's a Chinese number on an animal bone.","It's about 3,000 years old! Wow!"]}
  ]}
];

const box = document.getElementById('box');
box.innerHTML = '';
var _unitBases = [1509,428,251,1718,763,701];

// 进度模拟
(function(){
  var p = 0;
  var ring = document.getElementById('blRing');
  var num = document.getElementById('blNum');
  var bar = document.getElementById('blBar');
  var timer = setInterval(function(){
    if(!num || !bar) return;
    if(p < 85){ p += Math.max(1, (85-p)*0.08); }
    p = Math.min(99, p);
    var pi = Math.floor(p);
    num.textContent = pi + '%';
    bar.style.width = pi + '%';
    if(ring) ring.style.setProperty('--p', (pi*3.6)+'deg');
  }, 200);
  window.__finishLoading = function(){
    clearInterval(timer);
  };
})();

UNITS.forEach((u, ui)=>{
  const card = document.createElement('div');
  card.className = 'unit-card';
  // 默认全部折叠

  const head = document.createElement('div');
  head.className = 'unit-head';
  head.style.background = 'linear-gradient(135deg,'+u.grad[0]+','+u.grad[1]+')';
  head.innerHTML = '<span class="unum">'+u.unit+'</span><span class="utitle">'+u.title+'</span><span class="ucn">'+u.cn+'</span><span class="arrow">▼</span>';
  head.addEventListener('click', ()=>{
    const wasOpen = card.classList.contains('open');
    document.querySelectorAll('.unit-card.open').forEach(c=>c.classList.remove('open'));
    if(!wasOpen){ card.classList.add('open'); var ap = card.querySelector('.pane.active'); if(ap) preloadPane(ap); }
  });
  card.appendChild(head);

  const body = document.createElement('div');
  body.className = 'unit-body';

  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  var unitBase = _unitBases[ui]; var _sentSeq = 0;
  u.parts.forEach((p, pi)=>{
    const t = document.createElement('div');
    t.className = 'tab' + (pi===0?' active':'');
    const ICONS = {
      "Let's talk A": "💬", "Let's talk B": "💬",
      "Role-play": "🎭", "Ask and answer": "❓",
      "Choose and role-play": "🎭", "Count and say": "🔢",
      "Guess and check": "🔍", "Colour and say": "🎨",
      "Look and talk": "👀", "Look and say": "👀",
      "Do a survey": "📋",
      "Let's learn": "📖", "Let's learn B": "📖",
      "Listen and do": "👂", "Listen and chant": "🎵", "Listen and chant B": "🎵",
      "Start to read": "📚", "Reading time": "📖",
      "Project": "✏️"
    };
    t.innerHTML = '<span style="margin-right:4px">'+(ICONS[p.part]||'•')+'</span>'+p.part;
    t.style.setProperty('--c', u.color);
    if(pi===0){ t.style.background = u.color; t.style.color='#fff'; }
    t.addEventListener('click', ()=>{
      tabs.querySelectorAll('.tab').forEach(x=>{x.classList.remove('active');x.style.background='';x.style.color='';});
      t.classList.add('active'); t.style.background=u.color; t.style.color='#fff';
      body.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
      var panes = body.querySelectorAll('.pane'); panes.forEach(x=>x.classList.remove('active')); panes[pi].classList.add('active'); preloadPane(panes[pi]);
    });
    tabs.appendChild(t);
  });

function resetBtn(btn, orig){

function playOnce(url, text){
  try{ _currentAudio.pause(); }catch(e){}
  try{ _currentAudio.removeAttribute('src'); _currentAudio.load(); }catch(e){}
  _currentAudio.src = url;

}

let _playingAll = false;
function playAll(pane, allBtn){
  if(_playingAll){
    _playingAll = false;
    if(_currentAudio){ try{_currentAudio.pause();}catch(e){} }
    allBtn.textContent='播放全部'; allBtn.classList.remove('playing');
    return;
  }
  const btns = [...pane.querySelectorAll('.sent-play')];
  if(!btns.length) return;
  _playingAll = true;
  allBtn.textContent = '停止播放';
  allBtn.classList.add('playing');
  let i = 0;
  function next(){
    if(!_playingAll) return;
    if(i >= btns.length){ _playingAll=false; allBtn.textContent='播放全部'; allBtn.classList.remove('playing'); return; }
    const btn = btns[i++];
    // 传入 onEnd 回调：播放成功后自动播下一句
    playSentence(btn.dataset.s, btn, '▶', ()=>{ if(_playingAll) setTimeout(next, 400); });
  }
  next();
}

var _GC_PREFIX = '31_';

function _gcKey(text){
  var h = 0;
  for(var i=0;i<text.length;i++){ h=((h<<5)-h+text.charCodeAt(i))|0; }
  return 's'+Math.abs(h);
}
function upGet(k){
  return fetch(UP_URL+"/get/"+k,{headers:{"Authorization":"Bearer "+UP_TOKEN}})
    .then(r=>r.json()).then(d=>parseInt(d.result)||0).catch(()=>0);
}
function upIncr(k){

}
function showPlusOne(btn){

    });

function playSentence(text, btn, orig, onEnd){
  // 清除上一句的playing状态
  document.querySelectorAll('.sent-play.playing').forEach(function(b){ b.classList.remove('playing'); });
  document.querySelectorAll('.sent-card.playing').forEach(function(c){ c.classList.remove('playing'); });
  const dbg = btn.parentElement.querySelector('.dbg');
  
  // 优先用本地 base64 音频（不依赖网络，不会被浏览器拦截）
  if(typeof AUDIO_MAP !== 'undefined' && AUDIO_MAP[text]){
    var b0 = parseInt(btn.dataset.base)||0;
    var c0 = parseInt(btn.dataset.count)||b0;
    var newCount = c0+1;
    btn.dataset.count = newCount;
    if(dbg.childNodes[0]) dbg.childNodes[0].textContent = '播放'+newCount+'次';
    else dbg.textContent = '播放'+newCount+'次';
    dbg.style.color = '#10b981';
    showPlusOne(btn);
    upIncr(_GC_PREFIX+_gcKey(text));
    const audio = playOnce(AUDIO_MAP[text]);
    var card = btn.closest('.sent-card');
    audio.onplaying = ()=>{ btn.classList.add('playing'); card.classList.add('playing'); resetBtn(btn, orig); };
    audio.onended = ()=>{ btn.classList.remove('playing'); card.classList.remove('playing'); if(onEnd) onEnd(); };
    audio.play().catch(()=>{ if(onEnd) onEnd(); });
    resetBtn(btn, orig);
    return;
  }
  
  // 本地没有的句子，走在线 TTS
  let step = 0;
  function getUrl(i){
    if(i===0) return 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2';
    if(i===1) return 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=1';
    return 'https://fanyi.baidu.com/gettts?lan=en&text=' + encodeURIComponent(text) + '&spd=3&source=web';
  }
  const labels = ['有道美式', '有道英式', '百度TTS'];

  function tryPlay(){
    /* loading */
    dbg.style.color = '#f59e0b';
    const audio = playOnce(getUrl(step) + (step>0?'&_t='+Date.now():''));
    audio.onplaying = ()=>{
      var b1 = parseInt(btn.dataset.base)||0;
      var c1 = parseInt(btn.dataset.count)||b1;
      var nc1 = c1+1;
      btn.dataset.count = nc1;
      if(dbg.childNodes[0]) dbg.childNodes[0].textContent = '播放'+nc1+'次';
      else dbg.textContent = '播放'+nc1+'次';
      dbg.style.color = '#10b981';
      showPlusOne(btn);
      upIncr(_GC_PREFIX+_gcKey(text));
      var card2 = btn.closest('.sent-card');
      btn.classList.add('playing'); card2.classList.add('playing');
      resetBtn(btn, orig);
      audio.onended = ()=>{ btn.classList.remove('playing'); card2.classList.remove('playing'); if(onEnd) onEnd(); };
    };
    audio.onerror = ()=>{
      const c = audio.error ? audio.error.code : 0;
      if(c===1) return;
      step++;
      if(step < 3){ setTimeout(tryPlay, 300); return; }
      resetBtn(btn, orig);
      if(onEnd) onEnd();
    };
    audio.play().catch(()=>{
      step++;
      if(step < 3){ setTimeout(tryPlay, 300); }
      else{
        resetBtn(btn, orig);
        if(onEnd) onEnd();
      }
    });
  }
  tryPlay();

  if(_failTimer) clearTimeout(_failTimer);
  _failTimer = setTimeout(()=>{ dbg.style.color='#ef4444'; resetBtn(btn, orig); if(onEnd) onEnd(); }, 12000);
}

  pop.classList.add('show');

  pop.querySelector('.wp-pos').innerHTML = posArr.map(p=>'<div><b>'+esc(p.p)+'</b>'+esc(p.m)+'</div>').join('');

let _cbSeq = 0;
function fetchYoudao(w, pop){
  const cb = '__yd_'+(++_cbSeq);
  window[cb] = function(data){
    try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
    const s = document.getElementById('__yd_scr');
    if(s && s.parentNode) s.parentNode.removeChild(s);
    if(data && data.result && data.result.code===200 && data.data && data.data.entries && data.data.entries.length){
      const en = data.data.entries[0];
      if(en.entry && en.entry.toLowerCase() === w){
        fillPop(pop, en.entry, '', parseYd(en.explain||''), '有道词典');
      }else{
        pop.querySelector('.wp-word').textContent = w;
        pop.querySelector('.wp-pos').textContent = '未找到该词释义';
      }
    }else{
      pop.querySelector('.wp-word').textContent = w;
      pop.querySelector('.wp-pos').textContent = '未找到该词释义';
    }
  };
  const s = document.createElement('script');
  s.id = '__yd_scr';
  s.src = 'https://dict.youdao.com/suggest?num=1&doctype=json&q='+encodeURIComponent(w)+'&callback='+cb;
  s.onerror = ()=>{ pop.querySelector('.wp-pos').textContent = '在线查询失败（需联网）'; };
  document.body.appendChild(s);
}

function parseYd(txt){
  if(!txt) return [{p:'',m:'（暂无释义）'}];
  const parts = txt.split(/(?=(?:n|v|adj|adv|prep|conj|pron|num|int|art|aux|modal)\.)/);
  const out = [];
  parts.forEach(p=>{
    p = p.trim(); if(!p) return;
    const m = p.match(/^((?:n|v|adj|adv|prep|conj|pron|num|int|art|aux|modal)\.)\s*(.*)/);
    if(m) out.push({p:m[1], m:m[2]||''});
    else out.push({p:'', m:p});
  });
  return out.length ? out : [{p:'',m:txt}];
}

function speak(text){
  if(!text) return;
  // 单词发音用独立Audio，不影响整句播放的全局Audio
  const a = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2');
  a.play().catch(()=>{});
}
