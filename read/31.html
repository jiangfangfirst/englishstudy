const box = document.getElementById('box');
box.innerHTML = '';

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderUnits(){
  let h = '';
  UNITS.forEach(u=>{
    h += '<div class="unit-card" id="u'+u.un.replace('Unit ','')+'">' +
      '<div class="unit-head" style="background:linear-gradient(135deg,'+u.c1+','+u.c2+')" onclick="toggleUnit(this)">' +
      '<span class="unum">'+u.un+'</span><span class="utitle">'+u.title+'</span><span class="ucn">'+u.cn+'</span>' +
      '<span class="arrow">▾</span></div><div class="unit-body">' +
      '<p class="play-hint">共 '+u.blocks.length+' 块 · 整块连读</p>';
    u.blocks.forEach((b,bi)=>{
      h += '<div class="blk" id="b'+b.file.replace(/[^a-z0-9]/g,'')+'">' +
        '<div class="blk-head"><span class="blk-name">'+b.name+'</span><span class="blk-count">'+b.sents.length+' 句</span>' +
        '<button class="blk-play" data-file="'+b.file+'" onclick="playBlock(this)">▶ 播放</button></div>' +
        '<div class="blk-sents">'+b.sents.map(s=>'<div class="sen">'+esc(s)+'</div>').join('')+'</div>' +
        '</div>';
    });
    h += '</div></div>';
  });
  // Revision + Appendix
  EXTRAS.forEach(e=>{
    h += '<div class="unit-card" id="'+e.file.replace(/[^a-z0-9]/g,'')+'">' +
      '<div class="unit-head" style="background:linear-gradient(135deg,'+e.c1+','+e.c2+')" onclick="toggleUnit(this)">' +
      '<span class="unum">'+e.tag+'</span><span class="utitle">'+e.title+'</span><span class="ucn">'+e.cn+'</span>' +
      '<span class="arrow">▾</span></div><div class="unit-body">' +
      '<div class="blk"><div class="blk-head"><span class="blk-name">整块连读</span><span class="blk-count">'+e.sents.length+' 句</span>' +
      '<button class="blk-play" data-file="'+e.file+'" onclick="playBlock(this)">▶ 播放</button></div>' +
      '<div class="blk-sents">'+e.sents.map(s=>'<div class="sen">'+esc(s)+'</div>').join('')+'</div></div>' +
      '</div></div>';
  });
  box.innerHTML = h;
  // 默认展开 Unit 1
  var f = document.querySelector('.unit-card');
  if(f) f.classList.add('open');
}
function toggleUnit(head){
  var card = head.parentElement;
  card.classList.toggle('open');
}
// === 播放逻辑 ===
var _cur = null;
function playBlock(btn){
  var file = btn.dataset.file;
  var blk = btn.closest('.blk');
  if(_cur && _cur.file === file){
    stopBlock(); return;
  }
  stopBlock();
  var a = new Audio('audio/' + file);
  a.play().catch(function(){});
  _cur = {file:file, audio:a, btn:btn, blk:blk};
  btn.classList.add('playing'); btn.textContent = '◼ 停止';
  blk.classList.add('playing-card');
  a.addEventListener('ended', function(){ resetBtn(); });
  a.addEventListener('error', function(){ resetBtn(); });
}
function stopBlock(){
  if(_cur){
    try{ _cur.audio.pause(); _cur.audio.currentTime = 0; }catch(e){}
    resetBtn();
  }
}
function resetBtn(){
  if(_cur){
    _cur.btn.classList.remove('playing'); _cur.btn.textContent = '▶ 播放';
    _cur.blk.classList.remove('playing-card');
    _cur = null;
  }
}
renderUnits();
</script>
