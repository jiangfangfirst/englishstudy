 @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
 .header-animate-bg { background: linear-gradient(-45deg, #34d399, #22d3ee, #fbbf24); background-size: 180% 180%; animation: gradientMove 14s ease infinite; }

 .tab-bar { display: flex; gap: 24px; padding: 12px 4px; border-bottom: 2px solid #e5e7eb; margin-bottom: 8px; }
 .tab { font-size: 15px; font-weight: 600; color: #9ca3af; cursor: pointer; }
 .tab.active { font-weight: 800; }
 .vol-title { font-size: 16px; font-weight: 800; margin: 16px 0 4px; padding: 4px 4px 10px; border-bottom: 2px solid; }
 .vol-panel { display: none; }
 .vol-panel.active { display: block; animation: fadeIn .3s ease; }
 @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
 .row { display: flex; align-items: center; padding: 12px 4px; border-bottom: 1px dashed #e5e7eb; cursor: pointer; }
 .row:active { background: #f9fafb; }
 .row-title { flex: 1; }
 .row-title .name { font-size: 15px; font-weight: 600; display: block; }
 .row-title .stats { font-size: 11px; color: #9ca3af; margin-top: 2px; display: block; }
 .row-check { font-size: 13px; font-weight: 600; padding: 5px 14px; border-radius: 8px; text-decoration: none; white-space: nowrap; flex-shrink: 0; margin-left: 12px; }

<script>
 function goRow(row) {
   localStorage.setItem(row.dataset.key, (parseInt(localStorage.getItem(row.dataset.key)||'0')+1).toString());
   location.href = row.dataset.href;
 }
 document.querySelectorAll('.row').forEach(row => {
   const k = row.dataset.key;
   const el = row.querySelector('.stats');
   const base = parseInt(row.dataset.base);
   const color = row.dataset.color;
   const real = parseInt(localStorage.getItem(k) || '0');
   el.innerHTML = '<b style="color:' + color + ';">' + (base + real) + '</b>人已经学习';
 });
 function switchTab(el) {
   const bar = el.parentElement;
   bar.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.style.color=''; });
   el.classList.add('active');
   el.style.color = el.dataset.color;
   document.querySelectorAll('.vol-panel').forEach(p => p.classList.remove('active'));
   document.getElementById(el.dataset.target).classList.add('active');
 }
</script>
