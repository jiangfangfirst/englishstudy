<script>
 const UP_URL = "https://fitting-ostrich-312589.upstash.io";
 const UP_TOKEN = "gQAAAAAABMUNAAIgcDFiZDU2MDM2YWJkYzg0YTgyOTRlOTUzMjM1MWY1ZGJhNg";
 async function upGet(key) {
   try {
     const r = await fetch(UP_URL + "/get/" + key, { headers: { "Authorization": "Bearer " + UP_TOKEN } });
     const d = await r.json();
     return parseInt(d.result) || 0;
   } catch(e) { return 0; }
 }
 async function upIncr(key) {
   try {
     await fetch(UP_URL + "/incr/" + key, { headers: { "Authorization": "Bearer " + UP_TOKEN } });
   } catch(e) {}
 }
 document.querySelectorAll('.row-title').forEach(async a => {
   const k = a.dataset.key;
   const el = a.querySelector('.stats');
   const base = parseInt(a.dataset.base);
   const color = a.dataset.color;
   const real = await upGet(k);
   el.innerHTML = '<b style="color:' + color + ';">' + (base + real) + '</b>人已学';
   a.addEventListener('click', () => upIncr(k));
 });
 function switchTab(el) {
   const bar = el.parentElement;
   bar.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.style.color=''; });
   el.classList.add('active');
   el.style.color = el.dataset.color;
   document.querySelectorAll('.vol-panel').forEach(p => p.classList.remove('active'));
   document.getElementById(el.dataset.target).classList.add('active');
 }
</script>
