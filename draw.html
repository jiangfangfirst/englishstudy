<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>多多好学 动画导出工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#0f0f0f;color:#eee;overflow:hidden;height:100vh;display:flex}
#mainWrap{display:flex;width:100%;height:100%}
#canvasBox{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#070707}
#cvs{border:1px solid #333;background:#fff}

#effectPanel{width:260px;background:#181818;border-left:1px solid #333;padding:12px;overflow-y:auto;transition:0.25s}
#effectPanel.collapsed{transform:translateX(260px)}
#effectPanel h3{margin-bottom:10px;font-size:16px;color:#fff}
.effect-item{padding:8px 10px;margin:6px 0;background:#252525;border-radius:6px;cursor:pointer;font-size:14px}
.effect-item:hover{background:#333}
.effect-item.active{background:#2b5490}
.ctrl-row{margin-top:12px}
button{padding:8px 12px;border:none;border-radius:6px;background:#2b5490;color:#fff;cursor:pointer;margin:4px;font-size:14px}
button:hover{background:#3867b0}
button.sec{background:#333}
button.sec:hover{background:#444}

/* ===== 微调弹窗CSS【修复版】===== */
.floating-param{
  position:fixed;
  width:min(340px, calc(100vw - 24px));
  background:#1c1c1c;
  border:1px solid #444;
  border-radius:10px;
  padding:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.55);
  z-index:300;
  display:none;
  user-select:none;
}
.floating-param.show{display:block}
.fp-titlebar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:8px;
  margin-bottom:10px;
  border-bottom:1px solid #333;
  cursor:move;
}
.fp-close{
  width:24px;height:24px;
  display:grid;place-items:center;
  border-radius:4px;background:#333;
  cursor:pointer;font-weight:bold
}
.fp-line{margin:8px 0}
.fp-line label{display:block;font-size:13px;margin-bottom:3px;color:#ccc}
.fp-line input[type="range"]{width:100%}
</style>
</head>
<body>
<div id="mainWrap">
  <div id="canvasBox">
    <canvas id="cvs" width="800" height="450"></canvas>
  </div>
  <div id="effectPanel">
    <h3>效果列表</h3>
    <div id="listWrap"></div>
    <div class="ctrl-row">
      <button id="btnPlay">播放/暂停</button>
      <button id="btnReset" class="sec">重置</button>
    </div>
    <div class="ctrl-row">
      <button id="btnExportWebp">导出无损WebP动图</button>
      <button id="btnExportGif" class="sec">导出GIF</button>
    </div>
  </div>
</div>

<!-- 微调弹窗 -->
<div class="floating-param" id="floatingParam">
  <div class="fp-titlebar" id="fpTitleBar">
    <span id="fpTitle">效果</span>
    <span class="fp-close" id="fpClose">×</span>
  </div>
  <div class="fp-line">
    <label>强度</label>
    <input type="range" min="0" max="100" value="50" id="fpStrength">
  </div>
  <div class="fp-line">
    <label>范围</label>
    <input type="range" min="0" max="100" value="30" id="fpRange">
  </div>
  <div class="fp-line">
    <label>速度</label>
    <input type="range" min="1" max="100" value="20" id="fpSpeed">
  </div>
</div>

<script>
// ========== 内置 setUint24 【解决最初报错】 ==========
DataView.prototype.setUint24 = function(offset, value, littleEndian = false) {
  if (littleEndian) {
    this.setUint8(offset, value & 0xff);
    this.setUint8(offset + 1, (value >> 8) & 0xff);
    this.setUint8(offset + 2, (value >> 16) & 0xff);
  } else {
    this.setUint8(offset, (value >> 16) & 0xff);
    this.setUint8(offset + 1, (value >> 8) & 0xff);
    this.setUint8(offset + 2, value & 0xff);
  }
};

const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
const effectPanel = document.getElementById('effectPanel');
const listWrap = document.getElementById('listWrap');

const floatingParam = document.getElementById('floatingParam');
const fpTitleBar = document.getElementById('fpTitleBar');
const fpTitle = document.getElementById('fpTitle');
const fpClose = document.getElementById('fpClose');
const fpStrength = document.getElementById('fpStrength');
const fpRange = document.getElementById('fpRange');
const fpSpeed = document.getElementById('fpSpeed');

const btnPlay = document.getElementById('btnPlay');
const btnReset = document.getElementById('btnReset');
const btnExportWebp = document.getElementById('btnExportWebp');
const btnExportGif = document.getElementById('btnExportGif');

let selectedEffectId = null;
let fpJustOpened = false;
let playing = true;
let frame = 0;
const fps = 24;

// 示例效果，你后续自行扩充
const effects = [
  {id:"shake",name:"抖动",strength:40,range:20,speed:25},
  {id:"zoom",name:"缩放脉动",strength:35,range:15,speed:18},
  {id:"flash",name:"闪烁",strength:50,range:40,speed:30}
];

function renderList(){
  listWrap.innerHTML = '';
  effects.forEach(ef=>{
    const div = document.createElement('div');
    div.className = 'effect-item' + (selectedEffectId === ef.id ? ' active':'');
    div.textContent = ef.name;
    div.onclick = ()=> openFloatingParam(ef.id);
    listWrap.appendChild(div);
  })
}

function syncFloatPanelToSelected(){
  if(selectedEffectId === null) return;
  const ef = effects.find(x=>x.id === selectedEffectId);
  if(!ef){
    selectedEffectId = null;
    return;
  }
  fpTitle.textContent = ef.name;
  fpStrength.value = ef.strength;
  fpRange.value = ef.range;
  fpSpeed.value = ef.speed;
}

// ========== 弹窗打开（修复版） ==========
function openFloatingParam(id){
  selectedEffectId = id;
  syncFloatPanelToSelected();

  const boxW = floatingParam.offsetWidth || Math.min(340, window.innerWidth - 24);
  const boxH = floatingParam.offsetHeight || 160;
  const initLeft = (window.innerWidth - boxW)/2;
  const initTop  = (window.innerHeight - boxH)/2;

  floatingParam.style.left = initLeft + "px";
  floatingParam.style.top  = initTop + "px";
  floatingParam.style.bottom = "";
  floatingParam.style.transform = "";

  floatingParam.classList.add('show');
  effectPanel.classList.add('collapsed');
  fpJustOpened = true;
  setTimeout(()=> fpJustOpened = false, 300);
  renderList();
}

// ========== 统一关闭入口【核心修复：清除collapsed残留】 ==========
function closeFloatingParam(){
  floatingParam.classList.remove('show');
  floatingParam.style.left = "";
  floatingParam.style.top = "";
  effectPanel.classList.remove('collapsed');
  renderList();
}

fpClose.onclick = (ev)=>{
  ev.stopImmediatePropagation();
  closeFloatingParam();
};

// 点击空白关闭
document.addEventListener('click', (e)=>{
  if (!floatingParam.classList.contains('show')) return;
  if(fpJustOpened) return;
  if (floatingParam.contains(e.target)) return;
  if (effectPanel.contains(e.target)) return;
  closeFloatingParam();
});

// ========== 拖动逻辑【纯left+top，不会拉伸】 ==========
(function(){
  let dragging = false;
  let startX = 0, startY = 0;
  let boxStartLeft = 0, boxStartTop = 0;

  function onDown(clientX, clientY){
    dragging = true;
    startX = clientX;
    startY = clientY;
    const rect = floatingParam.getBoundingClientRect();
    boxStartLeft = rect.left;
    boxStartTop  = rect.top;
  }
  function onMove(clientX, clientY){
    if (!dragging) return;
    const dx = clientX - startX;
    const dy = clientY - startY;
    let newL = boxStartLeft + dx;
    let newT = boxStartTop + dy;
    newL = Math.max(0, newL);
    newT = Math.max(0, newT);
    floatingParam.style.left = newL + 'px';
    floatingParam.style.top  = newT + 'px';
  }
  function onUp(){ dragging = false; }

  fpTitleBar.addEventListener('mousedown', e=>{ e.preventDefault(); onDown(e.clientX, e.clientY); });
  fpTitleBar.addEventListener('touchstart', e=>{
    const t = e.touches[0];
    onDown(t.clientX, t.clientY);
  }, {passive:false});

  window.addEventListener('mousemove', e=>onMove(e.clientX, e.clientY));
  window.addEventListener('touchmove', e=>{
    if(!dragging) return;
    const t=e.touches[0];
    onMove(t.clientX,t.clientY);
  }, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
})();

// 滑块实时回写数据
fpStrength.oninput = ()=>{
  const ef = effects.find(x=>x.id === selectedEffectId);
  if(ef) ef.strength = +fpStrength.value;
}
fpRange.oninput = ()=>{
  const ef = effects.find(x=>x.id === selectedEffectId);
  if(ef) ef.range = +fpRange.value;
}
fpSpeed.oninput = ()=>{
  const ef = effects.find(x=>x.id === selectedEffectId);
  if(ef) ef.speed = +fpSpeed.value;
}

// 简单渲染逻辑
function draw(){
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.fillStyle="#222";
  ctx.font="28px sans-serif";
  ctx.textAlign="center";
  const ef = effects.find(x=>x.id === selectedEffectId);
  let ox=0,oy=0,scale=1;
  if(ef){
    const t = frame / fps * ef.speed;
    if(ef.id === "shake"){
      ox = Math.sin(t)*ef.range;
      oy = Math.cos(t*1.3)*ef.range;
    }else if(ef.id === "zoom"){
      scale = 1 + Math.sin(t)*ef.range/100;
    }else if(ef.id === "flash"){
      const v = (Math.sin(t)+1)/2;
      ctx.globalAlpha = 0.3 + v*0.7;
    }
  }
  ctx.save();
  ctx.translate(cvs.width/2 + ox, cvs.height/2 + oy);
  ctx.scale(scale,scale);
  ctx.fillText("Demo Text",0,0);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function loop(){
  if(playing) frame++;
  draw();
  requestAnimationFrame(loop);
}

btnPlay.onclick = ()=> playing = !playing;
btnReset.onclick = ()=> frame = 0;

// ========== 单帧WebP编码 ==========
async function encodeSingleLosslessWebp(canvasEl) {
  return new Promise((resolve, reject) => {
    canvasEl.toBlob(
      b => {
        if (!b) return reject(new Error("toBlob 返回空"));
        const r = new FileReader();
        r.onload = () => resolve(new Uint8Array(r.result));
        r.onerror = reject;
        r.readAsArrayBuffer(b);
      },
      "image/webp",
      { lossless: true }
    );
  });
}

async function encodeSingleLossyWebp(canvasEl) {
  return new Promise((res, rej)=>{
    canvasEl.toBlob(b=>{
      const r = new FileReader();
      r.onload=()=>res(new Uint8Array(r.result));
      r.onerror=rej;
      r.readAsArrayBuffer(b);
    },"image/webp",{quality:0.85});
  })
}

// ========== 组装 ANIM 动图WebP ==========
async function buildAnimatedWebP(frames, delays, width, height) {
  const chunks = [];
  const animBuf = new ArrayBuffer(6);
  const animView = new DataView(animBuf);
  animView.setUint32(0, 0, true);
  animView.setUint16(4, 0, true);
  chunks.push({fourcc: "ANIM", data: new Uint8Array(animBuf)});

  for (let i = 0; i < frames.length; i++) {
    const frameBin = frames[i];
    const dms = delays[i];
    const anmfBuf = new ArrayBuffer(16);
    const anmfView = new DataView(anmfBuf);
    anmfView.setUint24(0, 0, true);
    anmfView.setUint24(3, 0, true);
    anmfView.setUint24(6, width, true);
    anmfView.setUint24(9, height, true);
    anmfView.setUint32(12, dms, true);
    chunks.push({fourcc: "ANMF", data: new Uint8Array(anmfBuf)});

    const webpMagic = new TextDecoder().decode(frameBin.slice(8,12));
    if (webpMagic !== "WEBP") throw new Error(`第${i}帧不是webp`);
    let ptr = 12;
    while(ptr < frameBin.length) {
      const fourcc = new TextDecoder().decode(frameBin.slice(ptr, ptr+4));
      const sz = new DataView(frameBin.buffer, frameBin.byteOffset + ptr +4).getUint32(0, true);
      const chunkData = frameBin.slice(ptr+8, ptr+8+sz);
      chunks.push({fourcc, data:chunkData});
      ptr += 8 + sz + (sz & 1 ? 1 : 0);
    }
  }

  let totalPayloadLen = 0;
  for(const c of chunks) {
    totalPayloadLen += 8 + c.data.length + (c.data.length & 1 ? 1 : 0);
  }
  const riffBuf = new ArrayBuffer(12 + totalPayloadLen);
  const riffView = new DataView(riffBuf);
  const enc = new TextEncoder();
  enc.encodeInto("RIFF", new Uint8Array(riffBuf, 0,4));
  riffView.setUint32(4, totalPayloadLen, true);
  enc.encodeInto("WEBP", new Uint8Array(riffBuf, 8,4));
  let writePtr = 12;
  for(const ck of chunks) {
    enc.encodeInto(ck.fourcc, new Uint8Array(riffBuf, writePtr,4));
    riffView.setUint32(writePtr+4, ck.data.length, true);
    new Uint8Array(riffBuf, writePtr+8, ck.data.length).set(ck.data);
    writePtr += 8 + ck.data.length;
    if(ck.data.length & 1) {
      riffView.setUint8(writePtr, 0);
      writePtr += 1;
    }
  }
  return new Uint8Array(riffBuf);
}

// 导出WebP
btnExportWebp.onclick = async ()=>{
  alert("开始采集无损WebP帧...");
  const total = 24;
  const frameList = [];
  const delayList = [];
  const saveFrame = frame;
  for(let i=0;i<total;i++){
    frame = i;
    draw();
    const bin = await encodeSingleLosslessWebp(cvs);
    frameList.push(bin);
    delayList.push(1000/fps);
  }
  frame = saveFrame;
  draw();
  const animBin = await buildAnimatedWebP(frameList, delayList, cvs.width, cvs.height);
  const blob = new Blob([animBin], {type:"image/webp"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "anim_lossless.webp";
  a.click();
  URL.revokeObjectURL(a.href);
  alert("无损WebP导出完成（Chrome/Edge可播放）");
}

// 导出GIF（简易，如需高质量gif可以引入gif.js，这里只是占位）
btnExportGif.onclick = ()=> alert("GIF导出入口，你后续接入gif.js");

renderList();
loop();
</script>
</body>
</html>
