<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>人教版初中英语 · 单元范文目录</title>

<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F6F3EC;
  --paper-2:#EFEBE0;
  --ink:#2A2A26;
  --ink-soft:#6B665B;
  --deep:#1F3B5E;
  --deep-2:#18304E;
  --line:#E3DDD0;
  --g7:#2E82A8;
  --g8:#3A6B9E;
  --g9:#35507E;
  --accent:#C08A3E;
  --serif:"Noto Serif SC",serif;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}

/* ===== Hero ===== */
.hero{
  background:var(--deep);
  background-image:
    radial-gradient(1200px 500px at 85% -10%, rgba(192,138,62,.18), transparent 60%),
    radial-gradient(900px 420px at -5% 110%, rgba(46,130,168,.22), transparent 55%);
  color:#F3EFE3;
  padding:clamp(40px,7vw,72px) clamp(18px,5vw,60px) clamp(34px,5vw,52px);
  position:relative;
  overflow:hidden;
}
.hero-inner{max-width:1120px;margin:0 auto;position:relative;z-index:2}
.hero-kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-size:13px;letter-spacing:.18em;color:#C9B98F;
  font-weight:600;text-transform:uppercase;
}
.hero-kicker svg{width:20px;height:20px;stroke:#C9B98F}
.hero h1{
  font-family:var(--serif);
  font-size:clamp(28px,5.2vw,46px);
  font-weight:700;line-height:1.25;
  margin:18px 0 14px;letter-spacing:.01em;
}
.hero h1 .accent{color:#E3A94F}
.hero p.sub{
  max-width:620px;color:#D8D2C0;font-size:clamp(15px,2vw,17px);
}
.stats{
  display:flex;gap:clamp(24px,5vw,60px);
  margin-top:clamp(26px,4vw,40px);
  padding-top:22px;border-top:1px solid rgba(243,239,227,.16);
  flex-wrap:wrap;
}
.stat .num{
  font-family:var(--serif);font-size:clamp(26px,3.6vw,36px);font-weight:700;
  color:#E3A94F;line-height:1;
}
.stat .lbl{font-size:13px;color:#B9B2A0;margin-top:6px}

/* ===== 控制区：搜索 + 年级tab ===== */
.control{
  max-width:1120px;margin:0 auto;
  padding:26px clamp(18px,5vw,60px) 8px;
  position:sticky;top:0;z-index:20;
}
.control-bar{
  background:#FBF9F3;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 6px 20px rgba(31,59,94,.06);
  padding:12px 14px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
.search{flex:1 1 220px;min-width:180px;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;width:18px;height:18px;stroke:var(--ink-soft);pointer-events:none}
.search input{
  width:100%;padding:10px 14px 10px 40px;
  border:1px solid var(--line);border-radius:9px;
  background:#fff;font-size:14px;color:var(--ink);
  font-family:inherit;outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.search input:focus{border-color:#3A6B9E;box-shadow:0 0 0 3px rgba(58,107,158,.16)}
.search input::placeholder{color:#A49D8C}
.count-hint{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.tabs{display:flex;gap:6px}
.tab{
  padding:9px 18px;border-radius:9px;font-size:14px;font-weight:600;
  color:var(--ink-soft);transition:all .15s;white-space:nowrap;
  border:1px solid transparent;
}
.tab:hover{color:var(--ink);background:var(--paper-2)}
.tab.on{background:var(--deep);color:#F3EFE3;box-shadow:0 4px 12px rgba(31,59,94,.25)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.tab.on .dot{background:#E3A94F}

/* ===== 内容区 ===== */
main{max-width:1120px;margin:0 auto;padding:18px clamp(18px,5vw,60px) 70px}

.book-section{margin-top:30px}
.book-head{
  display:flex;align-items:center;gap:14px;
  padding:14px 6px 12px;
  border-bottom:2px solid var(--deep);
}
.book-head .num{
  font-family:var(--serif);font-size:15px;font-weight:700;color:#fff;
  background:var(--deep);border-radius:8px;
  padding:4px 12px;letter-spacing:.05em;
}
.book-head h2{font-family:var(--serif);font-size:clamp(20px,2.6vw,25px);font-weight:700}
.book-head .meta{font-size:13px;color:var(--ink-soft);margin-left:auto;white-space:nowrap}

.essay-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}

.essay{
  background:#FBF9F3;border:1px solid var(--line);border-radius:12px;
  padding:15px 16px;display:flex;gap:15px;align-items:center;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .12s, box-shadow .15s, border-color .15s;
  text-align:left;width:100%;
}
.essay:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(31,59,94,.09);border-color:#D3CCBB}
.essay:active{transform:translateY(0)}
.essay::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--g,var(--g7));
}
.essay-badge{
  flex:0 0 auto;width:52px;height:52px;border-radius:10px;
  background:color-mix(in srgb, var(--g,var(--g7)) 14%, #fff);
  color:var(--g,var(--g7));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;line-height:1.1;
}
.essay-badge .u{font-size:10px;font-weight:600;letter-spacing:.02em;opacity:.85}
.essay-badge .n{font-size:17px}
.essay-body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.essay-body .en{font-size:16px;font-weight:600;color:var(--ink);font-family:var(--serif);display:block;line-height:1.35}
.essay-body .cn{font-size:13px;color:var(--ink-soft);margin-top:2px;display:block}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{
  font-size:11px;padding:2px 9px;border-radius:20px;
  background:var(--paper-2);color:var(--ink-soft);
  border:1px solid var(--line);white-space:nowrap;
}
.tag.genre{background:#F2E9D7;color:#8A5A1E;border-color:#E6D6B5}
.essay-go{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);transition:all .15s;
}
.essay-go svg{width:16px;height:16px;stroke:currentColor}
.essay:hover .essay-go{background:var(--g,var(--g7));color:#fff;border-color:var(--g,var(--g7))}

/* 空态 */
.empty{
  text-align:center;padding:60px 20px;color:var(--ink-soft);
  border:1px dashed var(--line);border-radius:12px;margin-top:14px;
}
.empty svg{width:44px;height:44px;stroke:#B9B2A0;margin-bottom:12px}
.empty .t{font-size:16px;font-weight:600;color:var(--ink)}

footer{
  border-top:1px solid var(--line);
  padding:22px clamp(18px,5vw,60px) 40px;color:var(--ink-soft);
  font-size:13px;text-align:center;
}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);
  background:var(--deep);color:#F3EFE3;
  padding:12px 22px;border-radius:10px;font-size:14px;
  box-shadow:0 10px 30px rgba(31,59,94,.35);
  opacity:0;pointer-events:none;transition:all .25s;z-index:50;
  display:flex;align-items:center;gap:10px;max-width:88vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:17px;height:17px;stroke:#E3A94F;flex:0 0 auto}

@media (max-width:720px){
  .control{position:static}
  .stats{gap:26px}
  .essay{flex-wrap:nowrap}
  .tabs{width:100%;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .count-hint{display:none}
}
@media (max-width:430px){
  .hero{padding:32px 16px 30px}
  .stats{gap:22px}
  .control-bar{padding:10px}
  .essay{gap:12px;padding:13px}
  .essay-badge{width:46px;height:46px;border-radius:9px}
  .essay-badge .n{font-size:15px}
  .essay-badge .u{font-size:9px}
  .essay-body .en{font-size:15px}
  .essay-go{width:30px;height:30px}
  .book-section{margin-top:22px}
}
@media (max-width:360px){
  .essay{gap:10px;padding:12px 11px}
  .essay-badge{width:42px;height:42px}
  .essay-badge .n{font-size:14px}
  .essay-go{width:28px;height:28px}
  .essay-body .en{font-size:14.5px}
  .book-head .meta{display:none}
  .hero h1{font-size:24px}
  .stat .num{font-size:24px}
  .stat .lbl{font-size:12px}
}
</style>
</head>

  {grade:"九年级", book:"上册", unit:"Unit 4", en:"I Used to Be Afraid of the Dark", cn:"我的变化", genre:"对比说明", points:["used to","as long as"], id:"g9a-u4", g:"g9"},

  {grade:"九年级", book:"上册", unit:"Unit 6", en:"When Was It Invented?", cn:"发明创造", genre:"说明", points:["被动语态","who 定语从句"], id:"g9a-u6", g:"g9"},
  {grade:"九年级", book:"上册", unit:"Unit 7", en:"Teenagers Should Be Allowed to Choose", cn:"规则与选择", genre:"议论文", points:["should be allowed to"], id:"g9a-u7", g:"g9"},
  {grade:"九年级", book:"上册", unit:"Unit 8", en:"It Must Belong to Carla", cn:"推测与判断", genre:"记叙", points:["情态动词表推测"], id:"g9a-u8", g:"g9"},
  /* --- 九年级 下册（中考复习） --- */
  {grade:"九年级", book:"中考话题", unit:"话题一", en:"Learning Methods", cn:"学习方法", genre:"建议", points:["the+比较级","as long as"], id:"g9b-t1", g:"g9"},
  {grade:"九年级", book:"中考话题", unit:"话题二", en:"Traditional Festivals", cn:"中国传统节日", genre:"说明", points:["被动语态","be used to"], id:"g9b-t2", g:"g9"},
  {grade:"九年级", book:"中考话题", unit:"话题三", en:"Protecting the Environment", cn:"环境保护", genre:"建议", points:["现在完成时","if 条件句"], id:"g9b-t3", g:"g9"},
  {grade:"九年级", book:"中考话题", unit:"话题四", en:"Healthy Life", cn:"健康生活", genre:"建议", points:["should","动名词作主语"], id:"g9b-t4", g:"g9"},
  {grade:"九年级", book:"中考话题", unit:"话题五", en:"Growth and Change", cn:"成长与变化", genre:"对比说明", points:["used to","现在完成时"], id:"g9b-t5", g:"g9"},
  {grade:"九年级", book:"中考话题", unit:"话题六", en:"Sports and Health", cn:"运动与健康", genre:"记叙议论", points:["强调句","what 主语从句"], id:"g9b-t6", g:"g9"},
  {grade:"九年级", book:"中考话题", unit:"话题七", en:"Volunteering", cn:"志愿服务", genre:"记叙", points:["一般过去时","动名词作主语"], id:"g9b-t7", g:"g9"},
  {grade:"九年级", book:"中考话题", unit:"话题八", en:"Made in China", cn:"中国制造", genre:"说明", points:["被动语态","not only...but also"], id:"g9b-t8", g:"g9"}
];

const GRADE_COLOR = {七年级:"var(--g7)", 八年级:"var(--g8)", 九年级:"var(--g9)"};
const GRADE_HASH = {七年级:"g7", 八年级:"g8", 九年级:"g9"};

let currentGrade = "七年级";
let currentQuery = "";

const content = document.getElementById("content");
const tabs = document.getElementById("tabs");
const qInput = document.getElementById("q");
const emptyState = document.getElementById("empty-state");
const toast = document.getElementById("toast");
const toastTxt = document.getElementById("toast-txt");
let toastTimer = null;

/* 统计 */
document.getElementById("stat-total").textContent = DATA.length;
document.getElementById("stat-books").textContent = new Set(DATA.map(d=>d.grade+"-"+d.book)).size;

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* 短单元号：Starter→S1，Unit→U1，话题→T1 */
function shortBadge(unit){
  if(unit.startsWith("Starter")) return {u:"Starter", n:"1–3"};
  if(unit.startsWith("Unit")) return {u:"U", n:unit.replace("Unit ","")};
  return {u:"话题", n:unit.replace("话题","")};
}

function matches(q, it){
  const s = q.toLowerCase();
  return it.en.toLowerCase().includes(s)
    || it.cn.includes(q)
    || it.unit.toLowerCase().includes(s)
    || it.genre.includes(q)
    || it.points.some(p=>p.toLowerCase().includes(s));
}

function render(){
  const list = DATA.filter(it=> it.grade===currentGrade && (!currentQuery || matches(currentQuery,it)));
  const books = [...new Set(list.map(it=>it.book))];
  content.innerHTML = "";
  const empty = emptyState;
  empty.hidden = list.length>0;

  if(list.length===0) return;

  books.forEach(book=>{
    const items = list.filter(it=>it.book===book);
    const sec = document.createElement("section");
    sec.className = "book-section";
    sec.id = "book-"+book;

    const gColor = GRADE_COLOR[currentGrade];
    const head = document.createElement("div");
    head.className = "book-head";
    head.innerHTML =
      '<div class="num" style="background:'+gColor+'">'+esc(book)+'</div>'+
      '<h2>'+esc(currentGrade)+' · '+esc(book)+'</h2>'+
      '<div class="meta">'+items.length+' 篇</div>';
    sec.appendChild(head);

    const ul = document.createElement("div");
    ul.className = "essay-list";

    items.forEach(it=>{
      const b = shortBadge(it.unit);
      const tagHtml = it.points.map(p=>'<span class="tag">'+esc(p)+'</span>').join("");
      const card = document.createElement("button");
      card.className = "essay";
      card.style.setProperty("--g", GRADE_COLOR[currentGrade]);
      card.setAttribute("aria-label","查看《"+it.en+"》详情");
      card.innerHTML =
        '<span class="essay-badge"><span class="u">'+esc(b.u)+'</span><span class="n">'+esc(b.n)+'</span></span>'+
        '<span class="essay-body">'+
          '<span class="en">'+esc(it.en)+'</span>'+
          '<span class="cn">'+esc(it.cn)+' · '+esc(it.genre)+'</span>'+
          '<span class="tags"><span class="tag genre">'+esc(it.genre)+'</span>'+tagHtml+'</span>'+
        '</span>'+
        '<span class="essay-go"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>';
      card.addEventListener("click", ()=>openDetail(it));
      ul.appendChild(card);
    });

    sec.appendChild(ul);
    content.appendChild(sec);
  });
}

function openDetail(it){
  /* 详情页尚未生成：先提示，生成后改为跳转 detail/<id>.html */
  showToast("《"+it.en+"》详情页制作中，范文点评完善后即可查看");
}

function showToast(msg){
  toastTxt.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove("show"), 2600);
}

/* 年级 Tab */
function setGrade(g, updateHash){
  currentGrade = g;
  tabs.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("on", t.dataset.grade===g);
  });
  if(updateHash!==false) history.replaceState(null,"","#"+GRADE_HASH[g]);
  render();
}
tabs.addEventListener("click", e=>{
  const b = e.target.closest(".tab");
  if(b) setGrade(b.dataset.grade);
});

/* 搜索 */
qInput.addEventListener("input", ()=>{
  currentQuery = qInput.value.trim();
  render();
});

/* hash 路由 */
function applyHash(){
  const h = location.hash.replace("#","");
  if(h==="g8") setGrade("八年级", false);
  else if(h==="g9") setGrade("九年级", false);
  else setGrade("七年级", false);
}

/* 初始 */
applyHash();
</script>
</body>
</html>
