  <div class="panel-head">
    <h3>多多好学题库选题设置</h3>
    <button class="panel-close" id="panelClose" aria-label="关闭">✕</button>
  </div>
  <div class="panel-body">
    <div class="panel-section">
      <h4>题型题库（可只选部分题型）</h4>

        <button class="tool-btn" id="btnResetStandard" title="重置标准卷：标准题型题量，刷新试题">↺</button>
        <button class="tool-btn" id="btnRefreshAll" title="整体刷新：按当前题型题量，重新抽题">🔄</button>
        <button class="tool-btn" id="btnLoadAll" title="一键加载全部题库">⚡</button>
        <button class="tool-btn" id="btnGenerate" disabled title="生成试卷：按设置自动排版">📝</button>
        <button class="tool-btn" id="btnToggleAnswer" title="显示全卷翻译与答案">👁</button>

<div id="papersContainer"></div>

<script>
/* =========================================================
   零、全局状态
   ========================================================= */
let showAnswer = false;
let readingMode = 'auto';   /* auto | choice | qa */
const clearedTypes = new Set();

/* 阅读理解的六类顺序：每类优先各抽一篇 */
const READING_TYPE_ORDER = ['应用文/广告', '记叙文', '科普文', '人文说明文', '人物/故事', '任务型阅读'];

function pickReading(data, want) {
  if (!Array.isArray(data) || data.length === 0) return [];
  const groups = {};
  READING_TYPE_ORDER.forEach(function (t) { groups[t] = []; });
  data.forEach(function (item) {
    const t = item.type || '';
    if (!groups[t]) groups[t] = [];
    groups[t].push(item);
  });

  const result = [];
  const used = new Set();

  READING_TYPE_ORDER.forEach(function (t) {
    const list = groups[t] || [];
    const available = list.filter(function (x) { return !used.has(x); });
    if (available.length === 0) return;
    const picked = available[Math.floor(Math.random() * available.length)];
    result.push(picked);
    used.add(picked);
  });

  if (result.length < want) {
    const rest = data.filter(function (x) { return !used.has(x); });
    shuffle(rest);
    for (let i = 0; i < rest.length && result.length < want; i++) {
      result.push(rest[i]);
      used.add(rest[i]);
    }
  }

  return result.slice(0, want);
}

/* =========================================================
   一、题型配置（无听力，满分 100 分）
   ========================================================= */
const TYPES = [
  {
    id: 'single', name: 'Ⅰ. 单项填空', file: 'single.json',
    defaultCount: 10, scorePer: 1, unit: '题',
    partTitle: '第一部分 语言知识运用（共三大题，满分 35 分）',
    desc: '从每小题所给的 A、B、C、D 四个选项中选出一个可以填入空白处的最佳选项。',
    render: (items, num) => items.map((it, i) => {
      const div = makeQItem(num + i, it.stem, null);
      const body = div.querySelector('.q-body');
      body.appendChild(makeOptions(it.options));
      const ans = makeAnswerBox(it, null, { showStemZh: true });
      if (ans) body.appendChild(ans);
      return div;
    })
  },
  {
    id: 'cloze', name: 'Ⅱ. 完形填空', file: 'cloze.json',

/* =========================================================
   二、通用渲染工具
   ========================================================= */
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function formatStem(s) {
  return escapeHtml(s).replace(/\\n/g, '<br>').replace(/\r?\n/g, '<br>').replace(/ —/g, '<br>—');
}
function makeQItem(num, stem, stemZh) {
  const div = document.createElement('div');
  div.className = 'q-item';
  const numDiv = document.createElement('div');
  numDiv.className = 'q-num';
  numDiv.textContent = num + '.';
  const body = document.createElement('div');
  body.className = 'q-body';
  const stemDiv = document.createElement('div');
  stemDiv.className = 'q-stem';
  stemDiv.innerHTML = formatStem(stem || '');
  body.appendChild(stemDiv);
  if (stemZh) {
    const transDiv = document.createElement('div');
    transDiv.className = 'stem-translation' + (showAnswer ? ' show' : '');
    transDiv.innerHTML = escapeHtml(stemZh);
    body.appendChild(transDiv);
  }
  div.appendChild(numDiv);
  div.appendChild(body);
  return div;
}
function makeOptions(options, cls) {
  const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
  const wrap = document.createElement('div');
  wrap.className = 'q-options' + (cls ? ' ' + cls : '');
  (options || []).forEach((opt, i) => {
    const span = document.createElement('span');
    span.className = 'opt';
    span.textContent = letters[i] + '. ' + opt;
    wrap.appendChild(span);
  });
  return wrap;
}
function makeAnswerBox(item, sharedOptions, extra) {
  if (!item || item.answer === undefined || item.answer === null) return null;
  extra = extra || {};
  const answer = item.answer;
  const explanation = item.explanation;
  const options = Array.isArray(item.options) && item.options.length
      ? item.options
      : (Array.isArray(sharedOptions) ? sharedOptions : null);
  const optionsZh = Array.isArray(item.optionsZh) ? item.optionsZh : null;
  const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
  const box = document.createElement('div');
  box.className = 'answer-box' + (showAnswer ? ' show' : '');
  let html = '';
  let keyText, keyZh = '';
  if (typeof answer === 'number' && options && options[answer] !== undefined) {
    keyText = (letters[answer] || '—') + '. ' + (options[answer] || '');
    if (optionsZh && optionsZh[answer]) keyZh = '（' + optionsZh[answer] + '）';
  } else if (typeof answer === 'number') {
    keyText = letters[answer] || String(answer);
    if (typeof item.answerZh === 'string') keyZh = '（' + item.answerZh + '）';
  } else {
    keyText = String(answer);
    if (typeof item.answerZh === 'string') keyZh = '（' + item.answerZh + '）';
  }
  html += '<div class="answer-line"><span class="answer-label">答案</span>' +
          '<span class="answer-key">' + escapeHtml(keyText + keyZh) + '</span></div>';

  if (extra.showStemZh && item.stemZh) {
    html += '<div class="answer-line"><span class="answer-label">题干翻译</span>' +
            '<span class="answer-opts">' + escapeHtml(item.stemZh) + '</span></div>';
  }

  if (typeof answer === 'number' && options && options.length && optionsZh && optionsZh.length) {
    options.forEach(function (opt, i) {
      const zh = optionsZh[i];
      if (zh === undefined || zh === null || zh === '') return;
      html += '<div class="answer-line"><span class="answer-label">' + (letters[i] || '') + '</span>' +
              '<span class="answer-opts">' + escapeHtml(opt) + ' —— ' + escapeHtml(zh) + '</span></div>';
    });
  }

  if (explanation) {
    html += '<div class="answer-line"><span class="answer-label">解析</span>' +
            '<span class="answer-expl">' + escapeHtml(explanation) + '</span></div>';
  }
  box.innerHTML = html;
  return box;
}
function makeWritingAnswerBox(sample, explanation) {
  if (!sample && !explanation) return null;
  const box = document.createElement('div');
  box.className = 'answer-box' + (showAnswer ? ' show' : '');
  let html = '';
  if (sample) {
    html += '<div class="answer-line"><span class="answer-label">参考范文</span></div>' +
            '<div class="answer-sample">' + escapeHtml(sample) + '</div>';
  }
  if (explanation) {
    html += '<div class="answer-line"><span class="answer-label">解析</span>' +
            '<span class="answer-expl">' + escapeHtml(explanation) + '</span></div>';
  }
  box.innerHTML = html;
  return box;
}
function renderBlanksWithNums(text, startNum) {
  let idx = 0;
  return escapeHtml(String(text || '')).replace(/_+(\d*)_+/g, function () {
    const n = startNum + idx;
    idx++;
    return '<span class="cloze-blank">' + n + '</span>';
  });
}

/* 阅读/完形统一渲染：
   auto 模式下任务型阅读强制问答；
   choice 模式下全部按单选；
   qa 模式下全部按问答 */
function renderArticleGroup(items, num, forceLabels, mode) {
  mode = mode || 'auto';
  const nodes = [];
  let qNum = num;
  (items || []).forEach(function (passage, pIdx) {
    const startNum = qNum;
    const article = document.createElement('div');
    const labelText = forceLabels ? String.fromCharCode(65 + pIdx) : passage.label;
    if (labelText) {
      const label = document.createElement('div');
      label.className = 'passage-label';
      label.textContent = labelText;
      article.appendChild(label);
    }
    const p = document.createElement('p');
    p.className = 'passage';
    p.innerHTML = renderBlanksWithNums(passage.text, startNum);
    article.appendChild(p);
    if (showAnswer && passage.translation) {
      const trans = document.createElement('div');
      trans.className = 'passage-translation';
      trans.innerHTML = '<span class="trans-label">短文翻译</span>' +
                        renderBlanksWithNums(passage.translation, startNum);
      article.appendChild(trans);
    }
    nodes.push(article);

    const questions = passage.questions || [];
    const isTaskReading = passage.type === '任务型阅读';

    questions.forEach(function (q, j) {
      const hasOpts = Array.isArray(q.options) && q.options.length > 0;
      let qType;
      if (mode === 'choice') {
        qType = 'choice';
      } else if (mode === 'qa') {
        qType = 'qa';
      } else {
        qType = isTaskReading ? 'qa' : (hasOpts ? 'choice' : 'qa');
      }

      const div = makeQItem(startNum + j, q.stem || '', q.stemZh);
      const body = div.querySelector('.q-body');
      const stemEl = div.querySelector('.q-stem');

      if (qType === 'choice') {
        if (!q.stem) { if (stemEl) stemEl.remove(); }
        if (hasOpts) {
          body.appendChild(makeOptions(q.options));
        } else {
          const tip = document.createElement('div');
          tip.className = 'section-desc';
          tip.style.margin = '2px 0 0';
          tip.textContent = '（本题未提供 options 字段，无法显示 A/B/C/D）';
          body.appendChild(tip);
        }
        const ans = makeAnswerBox(q);
        if (ans) body.appendChild(ans);
      } else {
        if (!q.stem) { if (stemEl) stemEl.remove(); }
        if (!showAnswer) {
          const line = document.createElement('div');
          line.className = 'qa-blank-line';
          body.appendChild(line);
        }
        const ansObj = {
          answer: (q.answerText != null ? q.answerText : q.answer),
          options: null,
          explanation: q.explanation
        };
        const ans = makeAnswerBox(ansObj);
        if (ans) body.appendChild(ans);
      }
      nodes.push(div);
    });
    qNum = startNum + questions.length;
  });
  return nodes;
}

function renderDialogueGroup(items, num) {
  const nodes = [];
  let qNum = num;

  (items || []).forEach(function (item) {
    const questions = Array.isArray(item.questions) ? item.questions : null;

    if (!questions) {
      const div = makeQItem(qNum, item.stem, item.stemZh);
      const body = div.querySelector('.q-body');
      if (Array.isArray(item.options) && item.options.length) {
        body.appendChild(makeOptions(item.options, 'two-col'));
      }
      const ans = makeAnswerBox(item);
      if (ans) body.appendChild(ans);
      nodes.push(div);
      qNum += 1;
      return;
    }

    const startNum = qNum;
    const article = document.createElement('div');
    article.style.marginBottom = '8px';

    if (item.text) {
      const p = document.createElement('p');
      p.className = 'passage dialogue-text';
      p.innerHTML = renderBlanksWithNums(item.text, startNum).replace(/\\n/g, '<br>');
      article.appendChild(p);
    }

    const sharedOptions = Array.isArray(item.options) ? item.options : null;
    if (sharedOptions && sharedOptions.length) {
      const bank = document.createElement('div');
      bank.className = 'option-bank';
      sharedOptions.forEach(function (opt, i) {
        const span = document.createElement('span');
        span.textContent = String.fromCharCode(65 + i) + '. ' + opt;
        bank.appendChild(span);
      });
      article.appendChild(bank);
    }

    if (showAnswer && item.translation) {
      const trans = document.createElement('div');
      trans.className = 'passage-translation';
      trans.innerHTML = '<span class="trans-label">对话翻译</span>' +
        renderBlanksWithNums(item.translation, startNum).replace(/\\n/g, '<br>');
      article.appendChild(trans);
    }
    nodes.push(article);

    questions.forEach(function (q, j) {
      const div = makeQItem(startNum + j, q.stem || '', q.stemZh);
      const body = div.querySelector('.q-body');
      const stemEl = div.querySelector('.q-stem');

      if (!q.stem) {
        if (showAnswer) {
          if (stemEl) stemEl.remove();
        } else {
          if (stemEl) stemEl.innerHTML = '<span class="answer-blank"></span>';
        }
      }

      if (Array.isArray(q.options) && q.options.length) {
        body.appendChild(makeOptions(q.options, 'two-col'));
      }

      const ans = makeAnswerBox(q, sharedOptions);
      if (ans) body.appendChild(ans);

      nodes.push(div);
    });

    qNum = startNum + questions.length;
  });
  return nodes;
}

function renderSpelling(items, num) {
  return (items || []).map(function (it, i) {
    const qNum = num + i;
    const div = document.createElement('div');
    div.className = 'q-item';

    const numDiv = document.createElement('div');
    numDiv.className = 'q-num';
    numDiv.textContent = qNum + '.';

    const body = document.createElement('div');
    body.className = 'q-body';

    const stemDiv = document.createElement('div');
    stemDiv.className = 'q-stem';
    stemDiv.innerHTML = formatStem(it.stem || '').replace(/_{2,}/g, function () {
      return '<span class="spell-blank"></span>';
    });
    body.appendChild(stemDiv);

    if (it.stemZh) {
      const transDiv = document.createElement('div');
      transDiv.className = 'stem-translation' + (showAnswer ? ' show' : '');
      transDiv.innerHTML = escapeHtml(it.stemZh);
      body.appendChild(transDiv);
    }

    const ans = makeAnswerBox(it);
    if (ans) body.appendChild(ans);

    div.appendChild(numDiv);
    div.appendChild(body);
    return div;
  });
}

function renderWriting(items, num) {
  const nodes = [];
  (items || []).forEach(function (data, idx) {
    if (!data) return;
    const wrap = document.createElement('div');

    /* 多篇时给出小标题，单篇时不显示，保持原样 */
    if (items.length > 1) {
      const label = document.createElement('div');
      label.className = 'passage-label';
      label.textContent = '第 ' + (idx + 1) + ' 篇（满分 20 分）';
      wrap.appendChild(label);
    }

    if (data.prompt) {
      const desc = document.createElement('div');
      desc.className = 'section-desc';
      desc.innerHTML = formatStem(data.prompt);
      wrap.appendChild(desc);
    }
    const box = document.createElement('div');
    box.className = 'writing-box';
    box.textContent = data.note || '（此处为书面表达答题区，约 80–100 词）';
    wrap.appendChild(box);

    const ans = makeWritingAnswerBox(data.sampleAnswer, data.explanation);
    if (ans) wrap.appendChild(ans);

    nodes.push(wrap);
  });
  return nodes;
}

/* =========================================================
   三、统计与分值
   ========================================================= */
function getTypeStats(type, items) {
  if (!items || items.length === 0) return { count: 0, questions: 0, score: 0 };
  if (type.isPerPiece) {
    const qs = items.reduce(function (s, p) {
      if (Array.isArray(p.questions)) return s + p.questions.length;
      return s + 1;
    }, 0);
    return { count: items.length, questions: qs, score: qs * type.scorePer };
  }
  return { count: items.length, questions: items.length, score: items.length * type.scorePer };
}
function computeExamMeta(selections) {
  const activeTypes = [];
  let totalQuestions = 0, totalScore = 0;
  TYPES.forEach(function (type) {
    if (clearedTypes.has(type.id)) return;
    const items = selections[type.id];
    if (!items || items.length === 0) return;
    const s = getTypeStats(type, items);
    activeTypes.push(type);
    totalQuestions += s.questions;
    totalScore += s.score;
  });
  const isFullStandard = TYPES.every(function (type) {
    if (clearedTypes.has(type.id)) return false;
    const items = selections[type.id];
    return items && items.length === type.defaultCount;
  });
  return { activeTypes, totalQuestions, totalScore, isFullStandard };
}
function makeScoreText(type, stats) {
  if (type.id === 'writing') return '共 ' + stats.count + ' 题，满分 ' + stats.score + ' 分';
  if (type.isPerPiece) return '共 ' + stats.count + ' 篇（' + stats.questions + ' 小题）；每小题 ' + type.scorePer + ' 分，满分 ' + stats.score + ' 分';
  return '共 ' + stats.count + ' 小题；每小题 ' + type.scorePer + ' 分，满分 ' + stats.score + ' 分';
}

/* =========================================================

    notice = `1. 本试卷为组合练习，满分 ${meta.totalScore} 分，共 ${meta.totalQuestions} 题。<br>
              2. 请认真作答，完成后对照答案自查。`;

function makeHeadBlock(type, firstNode, stats, partTitle) {
  const block = document.createElement('div');
  block.className = 'section-head';
  if (partTitle) {
    const pt = document.createElement('div');
    pt.className = 'section-title';
    pt.textContent = partTitle;
    block.appendChild(pt);
  }
  const st = document.createElement('div');
  st.className = 'sub-title';
  st.textContent = type.name + '（' + makeScoreText(type, stats) + '）';
  block.appendChild(st);
  if (type.desc) {
    const d = document.createElement('div');
    d.className = 'section-desc';
    d.innerHTML = type.desc;
    block.appendChild(d);
  }
  if (firstNode) block.appendChild(firstNode);
  return block;
}
function paginate(blocks) {
  const container = document.getElementById('papersContainer');
  container.innerHTML = '';
  const measure = document.createElement('div');
  measure.className = 'paper measure-paper';
  const mc = document.createElement('div');
  mc.className = 'page-content';
  measure.appendChild(mc);
  const mf = document.createElement('div');
  mf.className = 'page-footer';
  measure.appendChild(mf);
  document.body.appendChild(measure);
  const pages = [];
  let pageBlocks = [];
  blocks.forEach(function (block) {
    mc.innerHTML = '';
    pageBlocks.forEach(function (b) { mc.appendChild(b); });
    mc.appendChild(block);
    if (mc.scrollHeight > mc.clientHeight + 2) {
      mc.removeChild(block);
      if (pageBlocks.length === 0) {
        pageBlocks.push(block);
        pages.push(pageBlocks);
        pageBlocks = [];
      } else {
        pages.push(pageBlocks);
        pageBlocks = [block];
      }
    } else {
      pageBlocks.push(block);
    }
  });
  if (pageBlocks.length) pages.push(pageBlocks);
  document.body.removeChild(measure);
  const total = pages.length;
  pages.forEach(function (pbs, i) {
    const paper = document.createElement('div');
    paper.className = 'paper';

    /* ★ 每页水印 */
    const wm = document.createElement('div');
    wm.className = 'watermark';
    wm.setAttribute('aria-hidden', 'true');
    ['多', '多', '好', '学'].forEach(function (ch) {
      const s = document.createElement('span');
      s.textContent = ch;
      wm.appendChild(s);
    });
    paper.appendChild(wm);

    const content = document.createElement('div');
    content.className = 'page-content';
    pbs.forEach(function (b) { content.appendChild(b); });
    const footer = document.createElement('div');
    footer.className = 'page-footer';
    footer.textContent = '第 ' + (i + 1) + ' 页  共 ' + total + ' 页';
    paper.appendChild(content);
    paper.appendChild(footer);
    container.appendChild(paper);
  });
  window.scrollTo(0, 0);
}
function renderExam(selections) {
  const meta = computeExamMeta(selections);
  if (meta.activeTypes.length === 0) {
    document.getElementById('papersContainer').innerHTML = `
      <div class="guide-card">
        <h2>当前没有可显示的题型</h2>
        <p>所有已加载的题型都被清除了。请点击面板中的 <strong>「取消清除」</strong> 恢复至少一种题型，或加载其他题库。</p>
      </div>
    `;
    window.scrollTo(0, 0);
    return;
  }
  const blocks = [makeHeaderBlock(meta)];
  let num = 1;
  let lastPartTitle = null;
  TYPES.forEach(function (type) {
    if (clearedTypes.has(type.id)) return;
    const items = selections[type.id];
    if (!items || items.length === 0) return;
    const stats = getTypeStats(type, items);
    const nodes = type.render(items, num) || [];
    let partTitle = null;
    if (meta.isFullStandard && type.partTitle && type.partTitle !== lastPartTitle) {
      partTitle = type.partTitle;
      lastPartTitle = type.partTitle;
    }
    blocks.push(makeHeadBlock(type, nodes[0], stats, partTitle));
    for (let i = 1; i < nodes.length; i++) blocks.push(nodes[i]);
    num += stats.questions;
  });
  paginate(blocks);
}

(function buildTypeList() {
  const list = document.getElementById('typeList');
  TYPES.forEach(function (type) {
    const item = document.createElement('div');
    item.className = 'type-item';
    item.dataset.type = type.id;

    const head = document.createElement('div');
    head.className = 'type-item-head';

    const nameEl = document.createElement('span');
    nameEl.className = 'type-name';
    nameEl.textContent = type.name;

    const statusEl = document.createElement('span');
    statusEl.className = 'type-status';
    statusEl.dataset.status = type.id;
    statusEl.textContent = '未加载';

    const refreshBtn = document.createElement('button');
    refreshBtn.className = 'btn-mini btn-refresh';
    refreshBtn.dataset.type = type.id;
    refreshBtn.textContent = '刷新';
    refreshBtn.disabled = true;
    refreshBtn.title = '从题库重新随机抽题并展示';
    refreshBtn.addEventListener('click', function () { refreshType(type.id); });

    const clearBtn = document.createElement('button');
    clearBtn.className = 'btn-mini btn-clear';
    clearBtn.dataset.type = type.id;
    clearBtn.textContent = '清除';
    clearBtn.disabled = true;
    clearBtn.title = '从试卷中移除此题型';
    clearBtn.addEventListener('click', function () { toggleClear(type.id); });

    head.appendChild(nameEl);
    head.appendChild(statusEl);

    if (type.id === 'reading') {
      const modeBtn = document.createElement('button');
      modeBtn.className = 'btn-mini btn-mode';
      modeBtn.dataset.type = type.id;
      const modeLabels = { auto: '阅读：自动', choice: '阅读：全单选', qa: '阅读：全问答' };
      modeBtn.textContent = modeLabels[readingMode];
      modeBtn.title = '切换阅读理解题型显示模式：自动（前 5 篇单选、第 6 篇任务型问答）/ 全单选 / 全问答';
      modeBtn.addEventListener('click', function () {
        const order = ['auto', 'choice', 'qa'];
        const idx = order.indexOf(readingMode);
        readingMode = order[(idx + 1) % 3];
        syncReadingModeBtn();
        if (lastSelections) renderExam(lastSelections);
      });
      head.appendChild(modeBtn);
    }

    head.appendChild(refreshBtn);
    head.appendChild(clearBtn);

    const controls = document.createElement('div');
    controls.className = 'type-item-controls';
    const qty = document.createElement('input');
    qty.type = 'number';
    qty.className = 'type-qty';
    qty.min = 1;
    qty.value = type.defaultCount;
    qty.dataset.type = type.id;
    qty.title = '本题型抽题数量（' + type.unit + '）';
    qty.addEventListener('change', function () {
      let v = parseInt(qty.value, 10);
      if (isNaN(v) || v < 1) v = 1;
      qty.value = v;
    });
    const unit = document.createElement('span');
    unit.className = 'type-unit';
    unit.textContent = type.unit;
    const btn = document.createElement('button');
    btn.className = 'btn-file';
    btn.dataset.type = type.id;
    btn.title = '点击选择 ' + type.file;
    btn.textContent = type.file;
    btn.addEventListener('click', function () { pickFile(type, btn); });
    const meta = document.createElement('span');
    meta.className = 'type-meta';
    if (type.id === 'reading') {
      meta.textContent = '标准 6 篇 · 共 20 小题 40 分';
    } else {
      meta.textContent = '标准 ' + type.defaultCount + ' ' + type.unit +
        (type.isPerPiece ? ' · 每小题 ' + type.scorePer + ' 分'
                         : ' · ' + (type.defaultCount * type.scorePer) + ' 分');
    }
    controls.appendChild(qty);
    controls.appendChild(unit);
    controls.appendChild(btn);
    controls.appendChild(meta);
    item.appendChild(head);
    item.appendChild(controls);
    list.appendChild(item);
  });
})();

function refreshType(typeId) {
  const type = TYPES.find(function (t) { return t.id === typeId; });
  const data = bankData[typeId];
  if (!type || !data || data.length === 0) return;

  if (!lastSelections) {
    const genBtn = document.getElementById('btnGenerate');
    if (genBtn.disabled) {
      alert('请先加载至少一种题型的题库');
      return;
    }
    genBtn.click();
    document.getElementById('panelStatus').textContent =
      '已生成试卷，如需继续刷新某题型，请再点击“刷新”。';
    return;
  }

  const want = getQtyInput(typeId) || type.defaultCount;
  let picked;
  if (typeof type.customPick === 'function') {
    picked = type.customPick(data, want);
  } else {
    picked = shuffle(data.slice()).slice(0, want);
  }

  lastSelections[typeId] = picked;
  renderExam(lastSelections);

  const status = document.getElementById('panelStatus');
  let msg = type.name.replace(/^[Ⅰ-Ⅹ]+\.\s*/, '') + ' 已重新抽题（' + picked.length + ' ' + type.unit + '）✓';
  if (picked.length < want) {
    msg += '　注意：题库仅有 ' + picked.length + ' ' + type.unit + '，不足 ' + want + ' ' + type.unit;
  }
  status.textContent = msg;
}

function toggleClear(typeId) {
  if (clearedTypes.has(typeId)) {
    clearedTypes.delete(typeId);
  } else {
    clearedTypes.add(typeId);
  }
  updateTypeButtons(typeId);
  checkAtLeastOne();
  if (lastSelections) {
    renderExam(lastSelections);
  }
}

function updateTypeButtons(typeId) {
  const hasData = bankData[typeId] && bankData[typeId].length > 0;
  const refreshBtn = document.querySelector('.btn-refresh[data-type="' + typeId + '"]');
  const clearBtn = document.querySelector('.btn-clear[data-type="' + typeId + '"]');

  if (refreshBtn) {
    refreshBtn.disabled = !hasData;
    refreshBtn.title = hasData ? '从题库重新随机抽题并展示' : '请先加载题库';
  }

  if (clearBtn) {
    clearBtn.disabled = !hasData;
    if (!hasData) {
      clearBtn.textContent = '清除';
      clearBtn.classList.remove('cleared');
      clearBtn.title = '请先加载题库';
    } else if (clearedTypes.has(typeId)) {
      clearBtn.textContent = '取消清除';
      clearBtn.classList.add('cleared');
      clearBtn.title = '点击恢复此题型到试卷';
    } else {
      clearBtn.textContent = '清除';
      clearBtn.classList.remove('cleared');
      clearBtn.title = '点击从试卷中移除此题型';
    }
  }
}

function pickFile(type, btn) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async function () {
    const file = input.files && input.files[0];
    if (!file) return;
    if (file.name !== type.file) {
      if (!confirm('⚠ 文件名与预期不一致\n\n题型：' + type.name +
        '\n预期：' + type.file + '\n实际：' + file.name +
        '\n\n确定继续加载吗？')) return;
    }
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!Array.isArray(data)) throw new Error('JSON 根节点必须是数组');
      if (data.length === 0) throw new Error('题库为空');
      bankData[type.id] = data;
      clearedTypes.delete(type.id);
      updateTypeStatus(type, data.length, file.name);
      btn.classList.add('loaded');
      btn.textContent = '✓ ' + file.name;
      updateTypeButtons(type.id);
      checkAtLeastOne();
    } catch (err) {
      alert('题库加载失败：' + (err.message || err));
    }
  };
  input.click();
}

function updateTypeStatus(type, len, fileName) {
  const el = document.querySelector('.type-status[data-status="' + type.id + '"]');
  if (!el) return;
  const def = type.defaultCount;
  let text;
  if (len < def) {
    //text = '已加载 ' + len + ' ' + type.unit + '（< 标准 ' + def + ' ' + type.unit + '） · ' + fileName;
    text = '共 ' + len + ' ' + type.unit;
    el.className = 'type-status warn';
  } else {
    //text = '已加载 ' + len + ' ' + type.unit + ' · ' + fileName;
    text = '共 ' + len + ' ' + type.unit;
    el.className = 'type-status ok';
  }
  el.textContent = text;
  el.title = text;
}

function markBtnLoaded(type, fileName) {
  const btn = document.querySelector('.btn-file[data-type="' + type.id + '"]');
  if (btn) {
    btn.classList.add('loaded');
    btn.textContent = '✓ ' + fileName;
  }
}

function checkAtLeastOne() {
  const usableTypes = TYPES.filter(function (t) {
    return bankData[t.id] && bankData[t.id].length > 0 && !clearedTypes.has(t.id);
  });
  document.getElementById('btnGenerate').disabled = usableTypes.length === 0;
  const status = document.getElementById('panelStatus');
  if (usableTypes.length === 0) {
    const loadedCount = TYPES.filter(function (t) {
      return bankData[t.id] && bankData[t.id].length > 0;
    }).length;
    if (loadedCount === 0) {
      status.textContent = '请为至少一种题型选择题库。';
    } else {
      status.textContent = '所有已加载题型都被清除了，请点击“取消清除”恢复至少一种。';
    }
  } else {
    status.textContent = '可生成 ' + usableTypes.length + ' 种题型。';
  }
}

/* =========================================================
   六、加载全部题库（带进度） + 自动加载
   ========================================================= */
async function loadAllBanks(opts) {
  opts = opts || {};
  const silent = !!opts.silent;
  const status = document.getElementById('panelStatus');

  if (location.protocol === 'file:') {
    if (!silent) {
      if (!confirm('⚠ 当前为 file:// 协议，浏览器会阻止自动读取本地 JSON。\n\n' +
        '建议启动本地服务器（如 python -m http.server 8000）。\n\n仍要继续尝试吗？')) {
        return { loaded: 0, failed: [], cancelled: true };
      }
    } else {
      return { loaded: 0, failed: [], cancelled: true, skipped: true };
    }
  }

  const btn = document.getElementById('btnLoadAll');
  const oldTitle = btn ? btn.title : '';
  if (btn) { btn.disabled = true; btn.title = '自动加载中…'; }

  let loaded = 0;
  const failed = [];
  const total = TYPES.length;

  for (let i = 0; i < total; i++) {
    const type = TYPES[i];
    status.textContent = '正在加载 ' + (i + 1) + '/' + total + '：' + type.file + ' …';
    try {
      const res = await fetch('./' + type.file, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) throw new Error('数据为空');
      bankData[type.id] = data;
      clearedTypes.delete(type.id);
      updateTypeStatus(type, data.length, type.file);
      markBtnLoaded(type, type.file);
      updateTypeButtons(type.id);
      loaded++;
    } catch (e) {
      failed.push(type.file);
    }
  }

  checkAtLeastOne();
  if (btn) { btn.disabled = false; btn.title = oldTitle; }
  return { loaded: loaded, failed: failed, cancelled: false, total: total };
}

/* ⚡ 按钮虽被隐藏，但保留事件，供内部/手动调用 */
document.getElementById('btnLoadAll').addEventListener('click', async function () {
  const r = await loadAllBanks({ silent: false });
  if (r.cancelled) return;
  if (r.failed.length === 0) {
    document.getElementById('panelStatus').textContent = '全部题库已加载完毕。';
  } else {
    alert('自动加载完成\n\n成功：' + r.loaded + ' 个\n失败：' + r.failed.length + ' 个\n\n失败文件：\n' +
      r.failed.join('\n') + '\n\n请确认这些文件与 page.html 同目录，或逐个手动选择。');
  }
});

/* =========================================================
   七、生成试卷 / 整体刷新 / 重置标准卷
   ========================================================= */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function getQtyInput(typeId) {
  const el = document.querySelector('.type-qty[data-type="' + typeId + '"]');
  if (!el) return null;
  const v = parseInt(el.value, 10);
  return isNaN(v) || v < 1 ? null : v;
}

function generateExam() {
  const selections = {};
  const warnings = [];

  TYPES.forEach(function (type) {
    const data = bankData[type.id];
    if (!data || data.length === 0) return;

    const want = getQtyInput(type.id) || type.defaultCount;
    let picked;
    if (typeof type.customPick === 'function') {
      picked = type.customPick(data, want);
    } else {
      picked = shuffle(data.slice()).slice(0, want);
    }

    if (picked.length < want) {
      warnings.push(type.name + '：需要 ' + want + ' ' + type.unit +
        '，题库仅有 ' + picked.length + ' ' + type.unit);
    }
    if (type.isPerPiece) {
      picked.forEach(function (p, i) {
        const qLen = Array.isArray(p.questions) ? p.questions.length : 1;
        if (qLen === 0) warnings.push(type.name + ' 第 ' + (i + 1) + ' 篇没有题目');
      });
    }
    selections[type.id] = picked;
  });

  if (Object.keys(selections).length === 0) {
    alert('请先加载至少一种题型的题库');
    return false;
  }

  lastSelections = selections;
  renderExam(selections);
  return warnings;
}

function setStatus(msg, warnings) {
  const status = document.getElementById('panelStatus');
  let text = msg;
  if (warnings && warnings.length) text += '　' + warnings.join('；');
  status.textContent = text;
}

/* 📝 按钮虽被隐藏，但保留事件（内部 .click() 仍可用） */
document.getElementById('btnGenerate').addEventListener('click', function () {
  const warnings = generateExam();
  if (warnings === false) return;
  setStatus('生成完毕 ✓', warnings);
});

document.getElementById('btnRefreshAll').addEventListener('click', function () {
  const loaded = TYPES.some(function (t) { return bankData[t.id] && bankData[t.id].length > 0; });
  if (!loaded) {
    alert('请先加载至少一种题型的题库');
    return;
  }
  const warnings = generateExam();
  if (warnings === false) return;
  setStatus('整卷已按当前题量重新乱序抽题 ✓', warnings);
});

document.getElementById('btnResetStandard').addEventListener('click', function () {
  const loaded = TYPES.some(function (t) { return bankData[t.id] && bankData[t.id].length > 0; });
  if (!loaded) {
    alert('请先加载至少一种题型的题库');
    return;
  }

  readingMode = 'auto';
  syncReadingModeBtn();

  TYPES.forEach(function (type) {
    const qty = document.querySelector('.type-qty[data-type="' + type.id + '"]');
    if (qty) qty.value = type.defaultCount;
    clearedTypes.delete(type.id);
    updateTypeButtons(type.id);
  });
  checkAtLeastOne();

  const warnings = generateExam();
  if (warnings === false) return;
  setStatus('已按标准题量重置并生成整卷 ✓', warnings);
});

/* =========================================================
   八、显示 / 隐藏翻译与答案
   ========================================================= */
document.getElementById('btnToggleAnswer').addEventListener('click', function () {
  showAnswer = !showAnswer;
  this.textContent = showAnswer ? '🙈' : '👁';
  this.title = showAnswer ? '隐藏全卷翻译与答案' : '显示全卷翻译与答案';
  this.classList.toggle('on', showAnswer);
  if (lastSelections) {
    renderExam(lastSelections);
  }
});

/* =========================================================
   九、初始状态 + 自动加载
   ========================================================= */
(function init() {
  setPanel(panelOpen);

  const fileRows = TYPES.map(function (t) {
    return '<div class="file-row"><span>' + t.file + '</span><span>' + t.name + '</span></div>';
  }).join('');

  document.getElementById('papersContainer').innerHTML = `
    <div class="guide-card">
      <h2>正在准备试卷（无听力 · 满分 100 分）</h2>
      <p>本页面为<strong>无听力版</strong>，共六大题：单选 10 + 完形 20 + 对话 5 + 阅读 40 + 拼写 5 + 写作 20 = <strong>100 分</strong>。</p>
      <p>页面会自动加载题库并生成整卷。若长时间没有试卷，请检查：</p>
      <ol>
        <li>6 个 JSON 文件是否与 <code>page.html</code> 在同一目录；</li>
        <li>文件名大小写是否与下表完全一致；</li>
        <li>是否通过 http/https 访问（<code>file://</code> 无法自动加载）。</li>
      </ol>
      <div class="guide-file-list">${fileRows}</div>
      <p class="guide-tip">
        可用操作：<strong>↺</strong> 重置标准卷 · <strong>🔄</strong> 整体刷新 · <strong>👁</strong> 显隐答案 · <strong>🖨️</strong> 打印 / 导出 PDF。<br>
        每个题型右侧可单独「刷新」「清除」，也可调整题量后点 🔄 整卷重抽。<br>
        数据结构：<code>translation</code>（短文翻译）、<code>stemZh</code>（题干翻译）、<code>optionsZh</code>（选项翻译）均可选；
        阅读每篇需带 <code>type</code> 字段；标准卷下第 6 篇（任务型阅读）以问答形式显示。
      </p>
    </div>
  `;

  /* ★ 打开页面即自动加载全部题库；全部成功则直接生成整卷 */
  loadAllBanks({ silent: true }).then(function (r) {
    if (r.cancelled) {
      const status = document.getElementById('panelStatus');
      if (status && r.skipped) {
        status.textContent = '本地文件打开，自动加载不可用，请用 http/https 访问。';
      }
      return;
    }

    if (r.loaded === 0) {
      document.getElementById('panelStatus').textContent =
        '自动加载失败（文件缺失或服务器配置问题），请检查 JSON 是否与 page.html 同目录。';
      return;
    }

    if (r.failed.length > 0) {
      document.getElementById('panelStatus').textContent =
        '已自动加载 ' + r.loaded + '/' + r.total + ' 种题型（' + r.failed.length + ' 个失败）。';
      /* 已成功加载的部分也先生成，至少能看到内容 */
      const warnings = generateExam();
      if (warnings !== false) setStatus('部分题库已加载并生成 ✓', warnings);
      return;
    }

    /* 全部成功：直接按标准题量生成整卷 */
    document.getElementById('panelStatus').textContent = '已自动加载全部题库，正在生成试卷…';
    const warnings = generateExam();
    if (warnings !== false) {
      setStatus('已自动加载并生成整卷 ✓', warnings);
    }
  });
})();
</script>
